<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYM Eletrônicos - Gestão</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        button, input, select { touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        
        .toast { transition: all 0.3s ease-in-out; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex overflow-hidden">

    <div id="printArea" class="hidden bg-white p-8 absolute w-full min-h-screen z-50"></div>
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-40">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-md mx-4 animate-fade-in">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg"><i class="fas fa-bolt text-2xl"></i></div>
                <h1 class="text-2xl font-bold text-slate-800">LYM Eletrônicos</h1>
                <p class="text-slate-500">Sistema de Gestão e Manutenção</p>
            </div>
            
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none transition" placeholder="Digite seu usuário">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-lg border border-slate-300 outline-none transition pr-12" placeholder="••••••••">
                        <button type="button" onclick="window.togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 outline-none"><i id="eyeIcon" class="fas fa-eye text-lg"></i></button>
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md text-lg mt-2">Entrar no Sistema</button>
            </form>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="appLayout" class="hidden w-full h-full flex flex-col md:flex-row">
        
        <nav class="bg-slate-900 text-white w-full md:w-64 flex-shrink-0 flex flex-col transition-all duration-300 z-20">
            <div class="p-4 sm:p-6 flex items-center justify-between md:justify-center border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <i class="fas fa-bolt text-blue-400 text-xl"></i>
                    <h2 class="text-xl font-bold tracking-wider flex items-center gap-2">LYM APP <span class="bg-blue-600 text-white text-[10px] px-2 py-1 rounded-full font-bold">v3.4</span></h2>
                </div>
                <button id="mobileMenuBtn" class="md:hidden text-white p-2"><i class="fas fa-bars text-2xl"></i></button>
            </div>
            
            <div id="navLinks" class="hidden md:flex flex-col flex-grow overflow-y-auto py-4"></div>

            <div class="p-4 border-t border-slate-700 hidden md:block" id="navFooter">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-blue-400 font-bold" id="userInitial">A</div>
                    <div class="overflow-hidden">
                        <p class="font-medium truncate" id="userNameDisplay">Admin</p>
                        <p class="text-xs text-slate-400 capitalize" id="userRoleDisplay">Administrador</p>
                    </div>
                </div>
                <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 py-2 rounded-lg transition"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </div>
        </nav>

        <main class="flex-grow flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <header class="bg-white shadow-sm px-6 py-4 flex md:hidden items-center justify-between border-b">
                <h1 class="text-lg font-bold text-slate-800" id="mobilePageTitle">Painel</h1>
                <button onclick="window.logout()" class="text-red-500"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </header>
            <div id="mainContent" class="flex-grow overflow-y-auto p-4 sm:p-8"></div>
        </main>
    </div>

    <!-- Modais -->
    <div id="modalCei" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center"><h3 class="font-bold text-lg" id="modalTitleCei">Nova Creche</h3><button onclick="window.hideElement('modalCei')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button></div>
            <form id="ceiForm" class="p-6 space-y-4">
                <div><label class="block text-sm font-semibold text-slate-700 mb-1">Nome da Creche</label><input type="text" id="ceiName" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></div>
                <div class="p-4 bg-blue-50 rounded-lg border border-blue-100"><p class="text-xs font-bold text-blue-800 mb-3"><i class="fab fa-telegram"></i> Integração Telegram</p><div class="space-y-3"><div><label class="block text-xs font-semibold text-slate-700 mb-1">ID do Grupo</label><input type="text" id="ceiTelegramId" class="w-full p-2 text-sm border rounded bg-white outline-none"></div><div><label class="block text-xs font-semibold text-slate-700 mb-1">ID do Tópico (Opcional)</label><input type="text" id="ceiTelegramTopicId" class="w-full p-2 text-sm border rounded bg-white outline-none"></div></div></div>
                <div class="flex justify-end gap-2 pt-4"><button type="button" onclick="window.hideElement('modalCei')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button><button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">Salvar</button></div>
            </form>
        </div>
    </div>

    <div id="modalUser" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center"><h3 class="font-bold text-lg" id="modalTitleUser">Novo Usuário</h3><button onclick="window.hideElement('modalUser')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button></div>
            <form id="userForm" class="p-6 space-y-4">
                <div><label class="block text-sm font-semibold text-slate-700 mb-1">Login</label><input type="text" id="newUsername" required class="w-full p-3 border rounded-lg outline-none"></div>
                <div><label class="block text-sm font-semibold text-slate-700 mb-1">Senha</label><input type="text" id="newPassword" required class="w-full p-3 border rounded-lg outline-none"></div>
                <div><label class="block text-sm font-semibold text-slate-700 mb-1">Permissão</label><select id="newRole" class="w-full p-3 border rounded-lg outline-none bg-white"><option value="funcionario">Funcionário (Apenas Registra)</option><option value="admin">Administrador (Total Acesso)</option></select></div>
                <div class="flex justify-end gap-2 pt-4"><button type="button" onclick="window.hideElement('modalUser')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button><button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">Salvar</button></div>
            </form>
        </div>
    </div>

    <div id="modalViewRecord" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in my-8">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center sticky top-0 z-10"><h3 class="font-bold text-lg" id="viewRecordTitle">Detalhes</h3><div class="flex gap-2"><button id="btnPrintRecord" class="px-3 py-1 bg-slate-800 text-white text-sm rounded hover:bg-slate-700 shadow-sm"><i class="fas fa-print mr-1"></i> Imprimir</button><button onclick="window.hideElement('modalViewRecord')" class="text-slate-500 hover:text-slate-800 ml-2"><i class="fas fa-times text-xl"></i></button></div></div>
            <div id="viewRecordContent" class="p-6"></div>
        </div>
    </div>

    <div id="modalConfirm" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in text-center p-6"><div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i class="fas fa-exclamation-triangle"></i></div><h3 class="font-bold text-lg mb-2">Tem certeza?</h3><p class="text-slate-500 mb-6 text-sm">Esta ação não pode ser desfeita.</p><div class="flex justify-center gap-3"><button onclick="window.hideElement('modalConfirm')" class="px-5 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium">Cancelar</button><button id="btnConfirmAction" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Sim, Excluir</button></div></div>
    </div>

    <script>
        const TELEGRAM_BOT_TOKEN = "8891515283:AAFhFKktpfr6wEQUF1UXCUcOJecAg8m7nKY";

        const firebaseConfig = {
            apiKey: "AIzaSyCLYjq-4yOXL-_GZ8vWAR_4GpV6wa5l6OM",
            authDomain: "lym-manutencao.firebaseapp.com",
            projectId: "lym-manutencao",
            storageBucket: "lym-manutencao.firebasestorage.app",
            messagingSenderId: "172405408906",
            appId: "1:172405408906:web:19ef22e87e8ecbe1d91973"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.localData = { ceis: [], users: [], reports: [], quotes: [], thirdParty: [], audit: [] };
        window.currentSystemUser = null; 
        window.activeTab = 'dashboard';
        window.editingItemId = null; 
        window.materialCount = 0;

        window.showElement = (id) => document.getElementById(id)?.classList.remove('hidden');
        window.hideElement = (id) => document.getElementById(id)?.classList.add('hidden');
        window.formatDateBR = (iso) => iso ? iso.split('-').reverse().join('/') : "";
        window.formatMoney = (val) => parseFloat(val || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            toast.className = `${colorClass} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-y-full opacity-0 transition-all duration-300 animate-fade-in z-50`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle'}"></i> <span class="font-medium">${msg}</span><button type="button" onclick="this.parentElement.remove()" class="ml-4 opacity-75 hover:opacity-100"><i class="fas fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-full', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-full', 'opacity-0'); setTimeout(() => toast.remove(), 5000); }, 5000);
        };

        let confirmActionCallback = null;
        window.confirmAction = (callback) => { confirmActionCallback = callback; window.showElement('modalConfirm'); };
        document.getElementById('btnConfirmAction').addEventListener('click', () => { if(confirmActionCallback) confirmActionCallback(); window.hideElement('modalConfirm'); confirmActionCallback = null; });

        window.initFirebaseSync = function() {
            const cols = ['users', 'ceis', 'reports', 'quotes', 'thirdParty', 'audit'];
            cols.forEach(col => {
                db.collection(col).onSnapshot(snap => {
                    window.localData[col] = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    if (col === 'users' && snap.empty) { db.collection('users').add({ login: 'admin', pass: 'admin123', role: 'admin' }); db.collection('users').add({ login: 'func', pass: 'func123', role: 'funcionario' }); }
                    if (window.currentSystemUser) window.renderActiveTab();
                });
            });
        };

        window.dbSave = async (colName, docId, data) => { data.updatedAt = new Date().toISOString(); if(docId) { await db.collection(colName).doc(docId).set(data, { merge: true }); } else { await db.collection(colName).add(data); } };
        window.dbDelete = async (colName, docId) => { await db.collection(colName).doc(docId).delete(); };
        window.logAudit = async (actionDesc) => { await db.collection('audit').add({ user: window.currentSystemUser ? window.currentSystemUser.login : 'Sistema', action: actionDesc, date: new Date().toLocaleString('pt-BR'), timestamp: Date.now() }); };

        window.togglePassword = function() {
            const pwd = document.getElementById('loginPassword'); const icon = document.getElementById('eyeIcon');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        };

        window.handleLogin = function(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim(); const p = document.getElementById('loginPassword').value.trim();
            let user = window.localData.users.find(x => (x.login === u && x.pass === p) || (x.username === u && x.password === p) || (x.login === u && x.password === p));
            if (!user) {
                if (u === 'admin' && p === 'admin123') { user = { id: 'master_admin', login: 'admin', role: 'admin' }; } 
                else if (u === 'func' && p === 'func123') { user = { id: 'master_func', login: 'func', role: 'funcionario' }; }
            }
            if (user) {
                window.currentSystemUser = { id: user.id, login: user.login || user.username, role: user.role };
                window.showToast(`Bem-vindo(a), ${window.currentSystemUser.login}!`); window.logAudit('Login realizado');
                window.hideElement('loginScreen'); window.showElement('appLayout');
                document.getElementById('userNameDisplay').textContent = window.currentSystemUser.login;
                document.getElementById('userRoleDisplay').textContent = user.role === 'admin' ? 'Administrador' : 'Funcionário';
                document.getElementById('userInitial').textContent = window.currentSystemUser.login.charAt(0).toUpperCase();
                window.buildMenu(); window.activeTab = user.role === 'admin' ? 'dashboard' : 'func-reports'; window.renderActiveTab();
            } else { window.showToast("Usuário ou senha inválidos!", "error"); }
        };

        window.logout = () => { window.logAudit('Logout Efetuado'); window.currentSystemUser = null; window.hideElement('appLayout'); window.showElement('loginScreen'); document.getElementById('loginForm').reset(); };

        window.buildMenu = () => {
            const navLinks = document.getElementById('navLinks'); navLinks.innerHTML = "";
            document.getElementById('mobileMenuBtn').onclick = () => { navLinks.classList.toggle('hidden'); navLinks.classList.toggle('flex'); };
            const role = window.currentSystemUser.role;
            let menuItems = role === 'admin' ? [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Resumo Geral' }, { id: 'admin-ceis', icon: 'fa-school', label: 'Creches (CEIs)' }, { id: 'admin-users', icon: 'fa-users', label: 'Usuários' }, { id: 'admin-reports', icon: 'fa-tools', label: 'Serviços Concluídos' }, { id: 'admin-quotes', icon: 'fa-file-invoice-dollar', label: 'Orçamentos' }, { id: 'admin-thirdParty', icon: 'fa-handshake', label: 'Serviços Terceiros' }, { id: 'admin-audit', icon: 'fa-list-alt', label: 'Auditoria' }
            ] : [
                { id: 'func-reports', icon: 'fa-wrench', label: 'Registrar Serviço' }, { id: 'func-quotes', icon: 'fa-file-invoice', label: 'Fazer Orçamento' }, { id: 'func-thirdParty', icon: 'fa-eye', label: 'Acompanhar Terceiro' }, { id: 'func-history', icon: 'fa-history', label: 'Meus Registros' }
            ];
            menuItems.forEach(item => {
                const a = document.createElement('a'); a.href = "#"; a.className = "flex items-center gap-3 px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition group";
                a.innerHTML = `<i class="fas ${item.icon} w-5 text-center group-hover:text-blue-400 transition"></i> <span class="font-medium">${item.label}</span>`;
                a.onclick = (e) => { e.preventDefault(); window.activeTab = item.id; if(window.innerWidth < 768) { navLinks.classList.add('hidden'); navLinks.classList.remove('flex'); } window.renderActiveTab(); };
                navLinks.appendChild(a);
            });
        };

        window.renderActiveTab = () => {
            if(!window.currentSystemUser) return;
            const role = window.currentSystemUser.role; let html = ""; let title = "";
            if(role === 'admin') {
                switch(window.activeTab) { case 'dashboard': title = "Resumo Geral"; html = renderAdminDashboard(); break; case 'admin-ceis': title = "Gestão de Creches"; html = renderAdminCeis(); break; case 'admin-users': title = "Gestão de Usuários"; html = renderAdminUsers(); break; case 'admin-reports': title = "Serviços Concluídos"; html = renderAdminReports(); break; case 'admin-quotes': title = "Orçamentos Recebidos"; html = renderAdminQuotes(); break; case 'admin-thirdParty': title = "Terceiros Acompanhados"; html = renderAdminThirdParty(); break; case 'admin-audit': title = "Logs de Auditoria"; html = renderAdminAudit(); break; }
            } else {
                switch(window.activeTab) { case 'func-reports': title = "Registrar Manutenção"; html = renderFuncReportForm(); break; case 'func-quotes': title = "Novo Orçamento"; html = renderFuncQuoteForm(); break; case 'func-thirdParty': title = "Acompanhar Terceiro"; html = renderFuncThirdPartyForm(); break; case 'func-history': title = "Meus Registros"; html = renderFuncHistory(); break; }
            }
            document.getElementById('mobilePageTitle').textContent = title;
            document.getElementById('mainContent').innerHTML = html.includes('flex justify-between') ? html : `<h2 class="text-2xl font-bold text-slate-800 mb-6 hidden md:block">${title}</h2>${html}`;
            
            if(window.activeTab === 'func-reports') populateCeiSelect('ceiSelectRep');
            if(window.activeTab === 'func-quotes') populateCeiSelect('ceiSelectQuote');
            if(window.activeTab === 'func-thirdParty') populateCeiSelect('ceiSelectThirdParty');
            if(window.activeTab === 'func-history') window.renderEmployeeHistory();
            if(['admin-reports', 'admin-quotes', 'admin-thirdParty'].includes(window.activeTab)) window.setupAdminFilters();
        };

        const populateCeiSelect = (id) => { const sel = document.getElementById(id); if(!sel) return; sel.innerHTML = '<option value="">Selecione a Creche...</option>' + window.localData.ceis.sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`).join(''); };

        // ADMIN TEMPLATES
        const renderAdminDashboard = () => `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-fade-in"><div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="fas fa-tools"></i></div><div><p class="text-slate-500 text-sm font-medium">Serviços</p><p class="text-2xl font-bold text-slate-800">${window.localData.reports.length}</p></div></div><div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="fas fa-file-invoice-dollar"></i></div><div><p class="text-slate-500 text-sm font-medium">Orçamentos</p><p class="text-2xl font-bold text-slate-800">${window.localData.quotes.length}</p></div></div><div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-2xl"><i class="fas fa-handshake"></i></div><div><p class="text-slate-500 text-sm font-medium">Terceiros</p><p class="text-2xl font-bold text-slate-800">${window.localData.thirdParty.length}</p></div></div><div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl"><i class="fas fa-school"></i></div><div><p class="text-slate-500 text-sm font-medium">Creches</p><p class="text-2xl font-bold text-slate-800">${window.localData.ceis.length}</p></div></div></div>`;
        const renderAdminCeis = () => { let trs = window.localData.ceis.map(c => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4 font-medium">${c.name}</td><td class="p-4 text-sm text-slate-500">${c.telegramGroupId || '-'} / ${c.telegramTopicId || '-'}</td><td class="p-4 text-right space-x-2"><button onclick="window.editCei('${c.id}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded"><i class="fas fa-edit"></i></button><button onclick="window.deleteCei('${c.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded"><i class="fas fa-trash"></i></button></td></tr>`).join(""); return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="p-4 border-b bg-slate-50 flex justify-between items-center"><h3 class="font-semibold text-slate-700">Creches Cadastradas</h3><button onclick="window.openCeiModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium shadow-sm"><i class="fas fa-plus mr-1"></i> Nova</button></div><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Nome</th><th class="p-4 font-semibold">Telegram (Grupo/Tópico)</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody>${trs || `<tr><td colspan="3" class="p-8 text-center text-slate-400">Nenhuma creche.</td></tr>`}</tbody></table></div></div>`; };

        window.compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
                            if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height); resolve(canvas.toDataURL('image/jpeg', quality));
                        } catch(e) { reject(e); }
                    }; img.onerror = () => reject("Erro img");
                }; reader.onerror = () => reject("Erro file");
            });
        };

        const dataURItoBlob = (dataURI) => {
            let byteString = atob(dataURI.split(',')[1]); let mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            let ab = new ArrayBuffer(byteString.length); let ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) { ia[i] = byteString.charCodeAt(i); }
            return new Blob([ab], {type: mimeString});
        };

        window.sendToTelegram = async (ceiId, dataObj, base64Photos, isEdit, typeLabel) => {
            const cei = window.localData.ceis.find(c => c.id === ceiId);
            if(!cei || !cei.telegramGroupId || cei.telegramGroupId.trim() === "") { throw new Error("A Creche selecionada não tem Grupo do Telegram configurado."); }
            
            const chatId = cei.telegramGroupId.trim(); const topicId = cei.telegramTopicId ? cei.telegramTopicId.trim() : null;
            let totalValue = 0; let materialText = "";
            
            if(dataObj.materials) {
                dataObj.materials.forEach(m => {
                    let v = parseFloat(m.price || 0); let q = parseFloat(m.qtd || 1);
                    totalValue += (v * q); materialText += `- ${q}x ${escapeHtml(m.name)} (${escapeHtml(m.brand)}) - R$ ${(v * q).toFixed(2)}\n`;
                });
            }

            let tgText = `${isEdit ? "🔄 <b>[CORREÇÃO DE SERVIÇO]</b>\n" : `🛠 <b>NOVO: ${typeLabel}</b>\n`}🏫 <b>CEI:</b> ${escapeHtml(cei.name)}\n👨‍🔧 <b>Técnico:</b> ${escapeHtml(dataObj.userName)}\n📅 <b>Data:</b> ${window.formatDateBR(dataObj.date)}\n`;
            if (dataObj.timeStart) tgText += `🕒 <b>Horário:</b> ${dataObj.timeStart} às ${dataObj.timeEnd}\n`;
            if (dataObj.workDone) tgText += `\n🛠 <b>Descrição/Serviço:</b>\n${escapeHtml(dataObj.workDone)}\n`;
            if (dataObj.materials && dataObj.materials.length > 0) tgText += `\n📦 <b>Materiais:</b>\n${materialText}<b>TOTAL: R$ ${totalValue.toFixed(2)}</b>\n`;
            if (dataObj.obs) tgText += `\n📌 <b>Obs:</b> ${escapeHtml(dataObj.obs)}\n`;

            const payload = { chat_id: chatId, text: tgText, parse_mode: 'HTML' };
            if (topicId) payload.message_thread_id = topicId;
            const rTxt = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            const rTxtJson = await rTxt.json();
            if (!rTxtJson.ok) throw new Error("Erro Telegram (Texto): " + rTxtJson.description);

            if (base64Photos && base64Photos.length > 0) {
                for (let b64 of base64Photos) {
                    try {
                        const blob = dataURItoBlob(b64);
                        const fdPhoto = new FormData(); fdPhoto.append('chat_id', chatId);
                        if (topicId) fdPhoto.append('message_thread_id', topicId);
                        fdPhoto.append('photo', blob, 'foto.jpg');
                        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fdPhoto });
                    } catch(e) { console.warn("Erro ao enviar foto", e); }
                }
            }

            let matsHtml = '';
            if(dataObj.materials && dataObj.materials.length > 0) {
                matsHtml = `<h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Materiais / Custos</h4><table style="width:100%; text-align:left; border-collapse:collapse; font-size:14px; margin-bottom:20px; border:1px solid #e2e8f0;"><thead style="background-color:#f1f5f9;"><tr><th style="padding:10px; border:1px solid #e2e8f0;">Qtd</th><th style="padding:10px; border:1px solid #e2e8f0;">Material</th><th style="padding:10px; border:1px solid #e2e8f0; text-align:right;">R$ Un.</th><th style="padding:10px; border:1px solid #e2e8f0; text-align:right;">Total</th></tr></thead><tbody>${dataObj.materials.map(m => `<tr><td style="padding:10px; border:1px solid #e2e8f0;">${m.qtd}</td><td style="padding:10px; border:1px solid #e2e8f0;">${escapeHtml(m.name)} (${escapeHtml(m.brand) || '-'})</td><td style="padding:10px; border:1px solid #e2e8f0; text-align:right;">${window.formatMoney(m.price)}</td><td style="padding:10px; border:1px solid #e2e8f0; text-align:right;">${window.formatMoney(m.qtd * m.price)}</td></tr>`).join('')}<tr style="background-color:#eff6ff;"><td colspan="3" style="padding:10px; border:1px solid #e2e8f0; text-align:right; font-weight:bold;">TOTAL:</td><td style="padding:10px; border:1px solid #e2e8f0; text-align:right; font-weight:bold; color:#1d4ed8;">${window.formatMoney(totalValue)}</td></tr></tbody></table>`;
            }

            let imgsHtml = '';
            if(base64Photos && base64Photos.length > 0) {
                imgsHtml = `<h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Fotos Anexadas</h4><div style="display:flex; flex-wrap:wrap; gap:10px;">${base64Photos.map(i => `<img src="${i}" style="height:180px; object-fit:cover; border-radius:4px; border:1px solid #cbd5e1;">`).join('')}</div>`;
            }

            const pdfContent = `
            <div style="padding:30px; font-family:Arial, sans-serif; color:#334155; background:#ffffff;">
                <div style="border-bottom:2px solid #1d4ed8; padding-bottom:10px; margin-bottom:20px;">
                    <h1 style="color:#1d4ed8; margin:0; font-size:24px;">LYM Eletrônicos</h1><p style="margin:5px 0 0 0; color:#64748b; font-size:14px;">Relatório de ${typeLabel}</p>
                </div>
                ${isEdit ? '<div style="background-color:#fef9c3; color:#a16207; padding:10px; border-radius:5px; margin-bottom:20px; font-weight:bold; text-align:center;">[REGISTRO CORRIGIDO/EDITADO]</div>' : ''}
                <div style="display:flex; justify-content:space-between; margin-bottom:20px; font-size:14px; background-color:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0;">
                    <div style="width:48%;">
                        <p style="margin:0 0 8px 0;"><span style="color:#64748b; font-weight:bold;">Data:</span> ${window.formatDateBR(dataObj.date)}</p>
                        <p style="margin:0 0 8px 0;"><span style="color:#64748b; font-weight:bold;">Registro por:</span> <span style="text-transform:capitalize;">${escapeHtml(dataObj.userName)}</span></p>
                        ${dataObj.difficulty ? `<p style="margin:0;"><span style="color:#64748b; font-weight:bold;">Dificuldade:</span> ${dataObj.difficulty}</p>` : ''}
                    </div>
                    <div style="width:48%;">
                        <p style="margin:0 0 8px 0;"><span style="color:#64748b; font-weight:bold;">CEI:</span> ${escapeHtml(cei.name)}</p>
                        ${dataObj.timeStart ? `<p style="margin:0 0 8px 0;"><span style="color:#64748b; font-weight:bold;">Horário:</span> ${dataObj.timeStart} às ${dataObj.timeEnd}</p>` : ''}
                        ${dataObj.companyName ? `<p style="margin:0;"><span style="color:#64748b; font-weight:bold;">Empresa:</span> ${escapeHtml(dataObj.companyName)}</p>` : ''}
                    </div>
                </div>
                <h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Serviço Realizado / Descrição</h4>
                <div style="background-color:#f8fafc; padding:15px; border-radius:8px; border:1px solid #e2e8f0; margin-bottom:20px;">
                    <p style="margin:0; line-height:1.5;">${dataObj.workDone ? escapeHtml(dataObj.workDone).replace(/\n/g, '<br>') : 'Sem descrição.'}</p>
                </div>
                ${matsHtml}
                ${dataObj.obs ? `<h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Observações</h4><div style="background-color:#fefce8; padding:15px; border-radius:8px; border:1px solid #fef08a; margin-bottom:20px;"><p style="margin:0; line-height:1.5;">${escapeHtml(dataObj.obs).replace(/\n/g, '<br>')}</p></div>` : ''}
                ${imgsHtml}
            </div>`;

            // Gerando PDF a partir da String
            const opt = { margin: 10, filename: `Relatorio.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
            let pdfBlob = await html2pdf().set(opt).from(pdfContent).output('blob');

            const fData = new FormData();
            fData.append('chat_id', chatId);
            if (topicId) fData.append('message_thread_id', topicId);
            fData.append('document', pdfBlob, `Relatorio_${typeLabel}.pdf`);
            
            const rDoc = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: fData });
            const rDocJson = await rDoc.json();
            if (!rDocJson.ok) throw new Error("Erro Telegram (PDF): " + rDocJson.description);

            return true;
        };

        window.saveRecord = async (e, type) => {
            e.preventDefault();
            const btnId = type === 'reports' ? 'btnSubmitReport' : (type === 'quotes' ? 'btnSubmitQuote' : 'btnSubmitThirdParty');
            const typeLabel = type === 'reports' ? 'Manutenção' : (type === 'quotes' ? 'Orçamento' : 'Acompanhamento');
            const btn = document.getElementById(btnId);
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Salvando...'; btn.disabled = true;

            try {
                const sffx = type === 'reports' ? 'Rep' : (type === 'quotes' ? 'Quote' : 'ThirdParty');
                
                const editId = document.getElementById(`editId${type}`)?.value || "";
                const isEdit = editId !== "";
                const recordId = isEdit ? editId : Date.now().toString();
                
                const selectElement = document.getElementById(`ceiSelect${sffx}`);
                const ceiId = selectElement?.options[selectElement.selectedIndex]?.getAttribute('data-id') || "";
                
                const recordData = {
                    id: String(recordId), userId: String(window.currentSystemUser?.id || "anon"), userName: String(window.currentSystemUser?.login || "Usuário"),
                    cei: String(selectElement?.value || "CEI Não Informada"), ceiId: String(ceiId), date: String(document.getElementById(`date${sffx}`)?.value || ""),
                    workDone: String(document.getElementById(`workDone${sffx}`)?.value || ""), obs: String(document.getElementById(`obs${sffx}`)?.value || ""), timestamp: new Date().toISOString()
                };

                if(type === 'reports' || type === 'thirdParty') { recordData.timeStart = String(document.getElementById(`timeStart${sffx}`)?.value || ""); recordData.timeEnd = String(document.getElementById(`timeEnd${sffx}`)?.value || ""); }
                if(type === 'thirdParty') recordData.companyName = String(document.getElementById('companyNameThirdParty')?.value || "");
                if(type === 'reports') recordData.difficulty = String(document.getElementById('diffRep')?.value || "Médio");

                if(type === 'reports' || type === 'quotes') {
                    const contId = type === 'reports' ? 'materialsContainer' : 'quoMaterialsContainer';
                    const mats = [];
                    document.getElementById(contId).querySelectorAll('[id^="mat_"]').forEach(row => {
                        mats.push({ name: String(row.querySelector('.mat-name')?.value || ""), brand: String(row.querySelector('.mat-brand')?.value || ""), qtd: String(row.querySelector('.mat-qtd')?.value || "1"), price: String(row.querySelector('.mat-price')?.value || "0") });
                    });
                    recordData.materials = mats;
                }

                let base64Photos = [];
                const fileInput = document.getElementById(type === 'reports' ? 'photosRep' : (type === 'quotes' ? 'photosQuote' : 'photosThirdParty'));
                if (fileInput && fileInput.files && fileInput.files.length > 0) {
                    for(let file of fileInput.files) { if (file.type.startsWith('image/')) base64Photos.push(await window.compressImage(file)); }
                } else if (isEdit) {
                    base64Photos = []; // Não reenviar fotos no edit
                }
                
                if (ceiId !== "") {
                    await window.sendToTelegram(ceiId, recordData, base64Photos, isEdit, typeLabel);
                    recordData.telegramSent = true;
                } else { 
                    throw new Error("Selecione uma Creche (CEI) com o Telegram configurado."); 
                }
                
                recordData.photos = []; // ZERO fotos no Firebase

                await window.dbSave(type, recordId, recordData);
                window.logAudit(`${isEdit ? 'Editou' : 'Registrou'} ${typeLabel} ID: ${recordId}`);
                window.showToast("Salvo e Enviado!", "success");
                
                if (isEdit) {
                    window.cancelEdit();
                } else {
                    document.getElementById(type === 'reports' ? 'reportForm' : (type==='quotes'?'quoteForm':'thirdPartyForm')).reset();
                    if(type === 'reports') { document.getElementById('materialsContainer').innerHTML = '<p class="text-sm italic text-slate-500">Nenhum material.</p>'; document.getElementById('repPhotoPreview').innerHTML = ''; }
                    if(type === 'quotes') { document.getElementById('quoMaterialsContainer').innerHTML = '<p class="text-sm italic text-slate-500">Nenhum material.</p>'; document.getElementById('quoPhotoPreview').innerHTML = ''; }
                    if(type === 'thirdParty') document.getElementById('tpPhotoPreview').innerHTML = '';
                }
            } catch (err) { console.error("ERRO COMPLETO AO SALVAR:", err); window.showToast("Falha: " + (err.message || "Erro técnico"), "error"); } 
            finally { btn.innerHTML = originalBtnText; btn.disabled = false; }
        };

        // EXPORTAR PARA IMPRESSÃO DE QUALQUER REGISTRO NO ADMIN
        window.printRecord = (type, record) => {
            const printArea = document.getElementById('printArea');
            const typeLabel = type === 'reports' ? 'Manutenção' : (type === 'quotes' ? 'Orçamento' : 'Acompanhamento');
            
            let matsHtml = '';
            let totalValue = 0;
            if(record.materials && record.materials.length > 0) {
                matsHtml = `<table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;"><thead><tr style="background: #1e293b; color: white; text-align: left;"><th style="padding: 10px;">Qtd</th><th style="padding: 10px;">Material</th><th style="padding: 10px; text-align:right;">R$ Un.</th><th style="padding: 10px; text-align:right;">Total</th></tr></thead><tbody>`;
                record.materials.forEach(m => {
                    const price = parseFloat(m.price || 0); const q = parseFloat(m.qtd || 1); const total = price * q; totalValue += total;
                    matsHtml += `<tr style="border-bottom: 1px solid #e2e8f0;"><td style="padding: 10px;">${q}</td><td style="padding: 10px;">${m.name} (${m.brand||'-'})</td><td style="padding: 10px; text-align:right;">${window.formatMoney(price)}</td><td style="padding: 10px; text-align:right;">${window.formatMoney(total)}</td></tr>`;
                });
                matsHtml += `<tr style="background: #f1f5f9; font-weight: bold;"><td colspan="3" style="padding: 10px; text-align: right;">TOTAL:</td><td style="padding: 10px; text-align:right; color: #1d4ed8;">${window.formatMoney(totalValue)}</td></tr></tbody></table>`;
            }

            printArea.innerHTML = `
                <div style="font-family: Arial, sans-serif; color: #334155; max-width: 800px; margin: 0 auto;">
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #1d4ed8; padding-bottom: 20px; margin-bottom: 20px;">
                        <div><h1 style="margin:0; font-size: 24px; color:#1d4ed8;">LYM Eletrônicos</h1><p style="margin:5px 0 0; color:#64748b; font-size:14px;">Documento de ${typeLabel}</p></div>
                        <div style="text-align: right; font-size:14px; color:#64748b;"><p style="margin:0;">Data: <strong>${window.formatDateBR(record.date)}</strong></p><p style="margin:0;">Ref: #LYM-${record.id.substring(record.id.length-6)}</p></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; background: #f8fafc; padding: 20px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px; font-size: 14px;">
                        <div style="width:48%;"><p style="margin:0 0 8px 0;"><strong>Técnico Responsável:</strong> <span style="text-transform:capitalize;">${record.userName}</span></p>${record.difficulty ? `<p style="margin:0 0 8px 0;"><strong>Dificuldade:</strong> ${record.difficulty}</p>` : ''}</div>
                        <div style="width:48%;"><p style="margin:0 0 8px 0;"><strong>Cliente / Local:</strong> ${record.cei}</p>${record.timeStart ? `<p style="margin:0 0 8px 0;"><strong>Horário:</strong> ${record.timeStart} às ${record.timeEnd}</p>` : ''}${record.companyName ? `<p style="margin:0;"><strong>Empresa Terceira:</strong> ${record.companyName}</p>` : ''}</div>
                    </div>
                    <h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Descrição do Serviço</h4>
                    <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 20px;"><p style="margin:0; line-height: 1.5;">${record.workDone ? record.workDone.replace(/\n/g, '<br>') : 'Nenhuma descrição'}</p></div>
                    ${matsHtml}
                    ${record.obs ? `<h4 style="font-weight:bold; color:#334155; margin-bottom:10px; border-bottom:1px solid #cbd5e1; padding-bottom:5px;">Observações</h4><div style="background: #fefce8; padding: 15px; border-radius: 8px; border: 1px solid #fef08a; margin-bottom: 20px;"><p style="margin:0; line-height:1.5;">${record.obs.replace(/\n/g, '<br>')}</p></div>` : ''}
                    <div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:50px; border-top: 1px solid #e2e8f0; padding-top:20px;">LYM Eletrônicos - Relatório gerado pelo sistema.</div>
                </div>`;
            window.print();
        };

        window.viewRecord = (type, id) => {
            const record = window.localData[type].find(r => r.id === id); if(!record) return;
            const btnPrint = document.getElementById('btnPrintRecord');
            btnPrint.onclick = () => window.printRecord(type, record);

            let html = `<div class="grid grid-cols-2 gap-y-2 text-sm mb-6 bg-slate-50 p-4 rounded border"><div><span class="font-bold text-slate-500">Data:</span> ${window.formatDateBR(record.date)}</div><div><span class="font-bold text-slate-500">CEI:</span> ${record.cei}</div><div><span class="font-bold text-slate-500">Registro por:</span> <span class="capitalize">${record.userName}</span></div>`;
            if(type === 'reports' || type === 'thirdParty') html += `<div><span class="font-bold text-slate-500">Horário:</span> ${record.timeStart} às ${record.timeEnd}</div>`;
            if(type === 'thirdParty') html += `<div class="col-span-2"><span class="font-bold text-slate-500">Empresa:</span> ${record.companyName}</div>`;
            if(type === 'reports') html += `<div><span class="font-bold text-slate-500">Dificuldade:</span> ${record.difficulty}</div>`;
            html += `</div>`;

            if(record.workDone) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Serviço Realizado / Descrição</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-slate-50 p-3 rounded border">${record.workDone}</p>`;

            if(record.materials && record.materials.length > 0) {
                html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Materiais / Custos</h4><table class="w-full text-sm text-left mb-6 border"><thead class="bg-slate-100"><tr><th class="p-2 border">Qtd</th><th class="p-2 border">Material</th><th class="p-2 border text-right">R$ Un.</th><th class="p-2 border text-right">Total</th></tr></thead><tbody>`;
                let totalGeral = 0;
                record.materials.forEach(m => {
                    const price = parseFloat(m.price || 0); const q = parseFloat(m.qtd || 1); const total = price * q; totalGeral += total;
                    html += `<tr><td class="p-2 border">${m.qtd}</td><td class="p-2 border">${m.name} (${m.brand||'-'})</td><td class="p-2 border text-right">${window.formatMoney(price)}</td><td class="p-2 border font-medium text-right">${window.formatMoney(total)}</td></tr>`;
                });
                if(type === 'reports' || type === 'quotes') html += `<tr class="bg-blue-50"><td colspan="3" class="p-2 border text-right font-bold">TOTAL:</td><td class="p-2 border font-bold text-blue-700 text-right text-lg">${window.formatMoney(totalGeral)}</td></tr>`;
                html += `</tbody></table>`;
            }

            if(record.obs) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Observações</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-yellow-50 p-3 border border-yellow-200 rounded">${record.obs}</p>`;
            if(record.telegramSent) { html += `<div class="bg-green-50 text-green-700 p-3 rounded-lg flex items-center gap-2 mt-4 border border-green-200 font-medium"><i class="fab fa-telegram text-xl"></i> PDF e Fotos enviados com sucesso para o Telegram da creche.</div>`; } 

            document.getElementById('viewRecordContent').innerHTML = html; window.showElement('modalViewRecord');
        };

        window.onload = () => { window.initFirebaseSync(); };
    </script>
</body>
</html>
