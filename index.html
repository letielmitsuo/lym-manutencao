<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LYM Eletrônicos - Gestão</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Bibliotecas Exportação e PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>

    <!-- FIREBASE SDKs (Versão Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Otimizações para Touch no Celular */
        button, input, select { touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex overflow-hidden">

    <div id="printArea" class="hidden bg-white p-8 absolute w-full min-h-screen z-50"></div>
    <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <!-- TELA DE LOGIN -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900 flex items-center justify-center z-40">
        <div class="bg-white p-8 sm:p-10 rounded-2xl shadow-2xl w-full max-w-md mx-4 animate-fade-in">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-bolt text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">LYM Eletrônicos</h1>
                <p class="text-slate-500">Sistema de Gestão e Manutenção</p>
            </div>
            
            <form id="loginForm" onsubmit="window.handleLogin(event)" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Digite seu usuário">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition shadow-md text-lg">
                    Entrar no Sistema
                </button>
            </form>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL -->
    <div id="appLayout" class="hidden w-full h-full flex flex-col md:flex-row">
        
        <!-- Sidebar (Menu Lateral) -->
        <nav class="bg-slate-900 text-white w-full md:w-64 flex-shrink-0 flex flex-col transition-all duration-300 z-20">
            <div class="p-4 sm:p-6 flex items-center justify-between md:justify-center border-b border-slate-700">
                <div class="flex items-center gap-3">
                    <i class="fas fa-bolt text-blue-400 text-xl"></i>
                    <h2 class="text-xl font-bold tracking-wider">LYM APP</h2>
                </div>
                <button id="mobileMenuBtn" class="md:hidden text-white p-2">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
            
            <div id="navLinks" class="hidden md:flex flex-col flex-grow overflow-y-auto py-4"></div>

            <div class="p-4 border-t border-slate-700 hidden md:block" id="navFooter">
                <div class="flex items-center gap-3 mb-4">
                    <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-blue-400 font-bold" id="userInitial">A</div>
                    <div class="overflow-hidden">
                        <p class="font-medium truncate" id="userNameDisplay">Admin</p>
                        <p class="text-xs text-slate-400 capitalize" id="userRoleDisplay">Administrador</p>
                    </div>
                </div>
                <button onclick="window.logout()" class="w-full flex items-center justify-center gap-2 bg-red-500/10 hover:bg-red-500/20 text-red-500 py-2 rounded-lg transition">
                    <i class="fas fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </nav>

        <!-- Área de Conteúdo Central -->
        <main class="flex-grow flex flex-col h-full bg-slate-50 relative overflow-hidden">
            <header class="bg-white shadow-sm px-6 py-4 flex md:hidden items-center justify-between border-b">
                <h1 class="text-lg font-bold text-slate-800" id="mobilePageTitle">Painel</h1>
                <button onclick="window.logout()" class="text-red-500"><i class="fas fa-sign-out-alt"></i> Sair</button>
            </header>
            
            <div id="mainContent" class="flex-grow overflow-y-auto p-4 sm:p-8"></div>
        </main>
    </div>

    <!-- Modal Cadastro CEI -->
    <div id="modalCei" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modalTitleCei">Nova Creche (CEI)</h3>
                <button onclick="window.hideElement('modalCei')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="ceiForm" onsubmit="window.saveCei(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Nome da Creche</label>
                    <input type="text" id="ceiName" required class="w-full p-3 border rounded-lg outline-none" placeholder="Ex: CEI Recanto Feliz">
                </div>
                <div class="p-4 bg-blue-50 rounded-lg border border-blue-100">
                    <p class="text-xs font-bold text-blue-800 mb-3"><i class="fab fa-telegram"></i> Integração Telegram</p>
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">ID do Grupo</label>
                            <input type="text" id="ceiTelegramId" class="w-full p-2 text-sm border rounded bg-white outline-none" placeholder="Ex: -100123456789">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 mb-1">ID do Tópico (Opcional)</label>
                            <input type="text" id="ceiTelegramTopicId" class="w-full p-2 text-sm border rounded bg-white outline-none" placeholder="Ex: 45">
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="window.hideElement('modalCei')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Cadastro Usuário -->
    <div id="modalUser" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden animate-fade-in">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg" id="modalTitleUser">Novo Usuário</h3>
                <button onclick="window.hideElement('modalUser')" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <form id="userForm" onsubmit="window.saveUser(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Login</label>
                    <input type="text" id="newUsername" required class="w-full p-3 border rounded-lg outline-none" placeholder="joao_silva">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
                    <input type="text" id="newPassword" required class="w-full p-3 border rounded-lg outline-none" placeholder="Senha do usuário">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Permissão</label>
                    <select id="newRole" class="w-full p-3 border rounded-lg outline-none bg-white">
                        <option value="funcionario">Funcionário (Apenas Registra)</option>
                        <option value="admin">Administrador (Total Acesso)</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-4">
                    <button type="button" onclick="window.hideElement('modalUser')" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Visualização de Registro (Admin) -->
    <div id="modalViewRecord" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in my-8">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center sticky top-0 z-10">
                <h3 class="font-bold text-lg" id="viewRecordTitle">Detalhes</h3>
                <div class="flex gap-2">
                    <button id="btnPrintRecord" class="hidden px-3 py-1 bg-slate-800 text-white text-sm rounded hover:bg-slate-700"><i class="fas fa-print"></i> Imprimir</button>
                    <button onclick="window.hideElement('modalViewRecord')" class="text-slate-500 hover:text-slate-800"><i class="fas fa-times text-xl"></i></button>
                </div>
            </div>
            <div id="viewRecordContent" class="p-6"></div>
        </div>
    </div>

    <!-- Modal de Confirmação -->
    <div id="modalConfirm" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in text-center p-6">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="font-bold text-lg mb-2">Tem certeza?</h3>
            <p class="text-slate-500 mb-6 text-sm">Esta ação não pode ser desfeita.</p>
            <div class="flex justify-center gap-3">
                <button onclick="window.hideElement('modalConfirm')" class="px-5 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium">Cancelar</button>
                <button id="btnConfirmAction" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS CORE: FIREBASE E LÓGICA -->
    <script>
        const TELEGRAM_BOT_TOKEN = "8891515283:AAFhFKktpfr6wEQUF1UXCUcOJecAg8m7nKY";

        // Configuração Oficial do Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCLYjq-4yOXL-_GZ8vWAR_4GpV6wa5l6OM",
            authDomain: "lym-manutencao.firebaseapp.com",
            projectId: "lym-manutencao",
            storageBucket: "lym-manutencao.firebasestorage.app",
            messagingSenderId: "172405408906",
            appId: "1:172405408906:web:19ef22e87e8ecbe1d91973",
            measurementId: "G-BECF0MECZ7"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Estado Global
        window.localData = { ceis: [], users: [], reports: [], quotes: [], thirdParty: [], audit: [] };
        window.currentSystemUser = null; 
        window.activeTab = 'dashboard';
        window.editingItemId = null; 
        window.materialCount = 0;

        // Utilitários de Interface
        window.showElement = (id) => document.getElementById(id)?.classList.remove('hidden');
        window.hideElement = (id) => document.getElementById(id)?.classList.add('hidden');
        window.formatDateBR = (iso) => iso ? iso.split('-').reverse().join('/') : "";
        window.formatMoney = (val) => parseFloat(val || 0).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            toast.className = `${colorClass} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-y-full opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-full', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        };

        // Confirmações
        let confirmActionCallback = null;
        window.confirmAction = (callback) => {
            confirmActionCallback = callback;
            window.showElement('modalConfirm');
        };
        document.getElementById('btnConfirmAction').addEventListener('click', () => {
            if(confirmActionCallback) confirmActionCallback();
            window.hideElement('modalConfirm'); confirmActionCallback = null;
        });

        // ==========================================
        // FIREBASE (Realtime Sync & DB Save)
        // ==========================================
        window.initFirebaseSync = function() {
            const cols = ['users', 'ceis', 'reports', 'quotes', 'thirdParty', 'audit'];
            cols.forEach(col => {
                db.collection(col).onSnapshot(snap => {
                    window.localData[col] = snap.docs.map(d => ({id: d.id, ...d.data()}));
                    
                    // Injeta usuários padrão se o banco estiver 100% vazio
                    if (col === 'users' && snap.empty) {
                        db.collection('users').add({ login: 'admin', pass: 'admin123', role: 'admin' });
                        db.collection('users').add({ login: 'func', pass: 'func123', role: 'funcionario' });
                    }

                    if (window.currentSystemUser) window.renderActiveTab();
                });
            });
        };

        window.dbSave = async (colName, docId, data) => {
            data.updatedAt = new Date().toISOString();
            if(docId) {
                await db.collection(colName).doc(docId).set(data, { merge: true });
            } else {
                await db.collection(colName).add(data);
            }
        };

        window.dbDelete = async (colName, docId) => {
            await db.collection(colName).doc(docId).delete();
        };

        window.logAudit = async (actionDesc) => {
            await db.collection('audit').add({
                user: window.currentSystemUser ? window.currentSystemUser.login : 'Sistema',
                action: actionDesc,
                date: new Date().toLocaleString('pt-BR'),
                timestamp: Date.now()
            });
        };

        // ==========================================
        // AUTENTICAÇÃO
        // ==========================================
        window.handleLogin = function(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            
            // Busca o usuário compatível (checa username ou login por redundância)
            const user = window.localData.users.find(x => 
                (x.login === u && x.pass === p) || (x.username === u && x.password === p)
            );
            
            if (user) {
                window.currentSystemUser = { id: user.id, login: user.login || user.username, role: user.role };
                window.showToast(`Bem-vindo(a), ${window.currentSystemUser.login}!`);
                window.logAudit('Login realizado');
                
                window.hideElement('loginScreen');
                window.showElement('appLayout');
                
                document.getElementById('userNameDisplay').textContent = window.currentSystemUser.login;
                document.getElementById('userRoleDisplay').textContent = user.role === 'admin' ? 'Administrador' : 'Funcionário';
                document.getElementById('userInitial').textContent = window.currentSystemUser.login.charAt(0).toUpperCase();
                
                window.buildMenu();
                window.activeTab = user.role === 'admin' ? 'dashboard' : 'func-reports';
                window.renderActiveTab();
            } else {
                window.showToast("Usuário ou senha inválidos!", "error");
            }
        };

        window.logout = () => {
            window.logAudit('Logout Efetuado');
            window.currentSystemUser = null;
            window.hideElement('appLayout');
            window.showElement('loginScreen');
            document.getElementById('loginForm').reset();
        };

        // ==========================================
        // RENDERIZAÇÃO DO MENU E ABAS (CORE)
        // ==========================================
        window.buildMenu = () => {
            const navLinks = document.getElementById('navLinks');
            navLinks.innerHTML = "";
            document.getElementById('mobileMenuBtn').onclick = () => {
                navLinks.classList.toggle('hidden'); navLinks.classList.toggle('flex');
            };

            const role = window.currentSystemUser.role;
            let menuItems = role === 'admin' ? [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Resumo Geral' },
                { id: 'admin-ceis', icon: 'fa-school', label: 'Creches (CEIs)' },
                { id: 'admin-users', icon: 'fa-users', label: 'Usuários' },
                { id: 'admin-reports', icon: 'fa-tools', label: 'Serviços Concluídos' },
                { id: 'admin-quotes', icon: 'fa-file-invoice-dollar', label: 'Orçamentos' },
                { id: 'admin-thirdParty', icon: 'fa-handshake', label: 'Serviços Terceiros' },
                { id: 'admin-audit', icon: 'fa-list-alt', label: 'Auditoria' }
            ] : [
                { id: 'func-reports', icon: 'fa-wrench', label: 'Registrar Serviço' },
                { id: 'func-quotes', icon: 'fa-file-invoice', label: 'Fazer Orçamento' },
                { id: 'func-thirdParty', icon: 'fa-eye', label: 'Acompanhar Terceiro' },
                { id: 'func-history', icon: 'fa-history', label: 'Meus Registros' }
            ];

            menuItems.forEach(item => {
                const a = document.createElement('a');
                a.href = "#";
                a.className = "flex items-center gap-3 px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition group";
                a.innerHTML = `<i class="fas ${item.icon} w-5 text-center group-hover:text-blue-400 transition"></i> <span class="font-medium">${item.label}</span>`;
                a.onclick = (e) => {
                    e.preventDefault();
                    window.activeTab = item.id;
                    if(window.innerWidth < 768) { navLinks.classList.add('hidden'); navLinks.classList.remove('flex'); }
                    window.renderActiveTab();
                };
                navLinks.appendChild(a);
            });
        };

        window.renderActiveTab = () => {
            if(!window.currentSystemUser) return;
            const role = window.currentSystemUser.role;
            let html = ""; let title = "";

            if(role === 'admin') {
                switch(window.activeTab) {
                    case 'dashboard': title = "Resumo Geral"; html = renderAdminDashboard(); break;
                    case 'admin-ceis': title = "Gestão de Creches"; html = renderAdminCeis(); break;
                    case 'admin-users': title = "Gestão de Usuários"; html = renderAdminUsers(); break;
                    case 'admin-reports': title = "Serviços Concluídos"; html = renderAdminReports(); break;
                    case 'admin-quotes': title = "Orçamentos Recebidos"; html = renderAdminQuotes(); break;
                    case 'admin-thirdParty': title = "Terceiros Acompanhados"; html = renderAdminThirdParty(); break;
                    case 'admin-audit': title = "Logs de Auditoria"; html = renderAdminAudit(); break;
                }
            } else {
                switch(window.activeTab) {
                    case 'func-reports': title = "Registrar Manutenção"; html = renderFuncReportForm(); break;
                    case 'func-quotes': title = "Novo Orçamento"; html = renderFuncQuoteForm(); break;
                    case 'func-thirdParty': title = "Acompanhar Terceiro"; html = renderFuncThirdPartyForm(); break;
                    case 'func-history': title = "Meus Registros"; html = renderFuncHistory(); break;
                }
            }
            
            document.getElementById('mobilePageTitle').textContent = title;
            document.getElementById('mainContent').innerHTML = `<h2 class="text-2xl font-bold text-slate-800 mb-6 hidden md:block">${title}</h2>${html}`;
            
            // Post Render Triggers
            if(window.activeTab === 'func-reports') populateCeiSelect('ceiSelectRep');
            if(window.activeTab === 'func-quotes') populateCeiSelect('ceiSelectQuote');
            if(window.activeTab === 'func-thirdParty') populateCeiSelect('ceiSelectThirdParty');
            if(window.activeTab === 'func-history') window.renderEmployeeHistory();
            if(['admin-reports', 'admin-quotes', 'admin-thirdParty'].includes(window.activeTab)) window.setupAdminFilters();
        };

        // ==========================================
        // LAYOUTS (GERADORES HTML)
        // ==========================================
        
        const populateCeiSelect = (id) => {
            const sel = document.getElementById(id); if(!sel) return;
            sel.innerHTML = '<option value="">Selecione a Creche...</option>' + window.localData.ceis.sort((a,b)=>a.name.localeCompare(b.name)).map(c => `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`).join('');
        };

        // ------------- ADMIN -------------
        const renderAdminDashboard = () => `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-fade-in">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="fas fa-tools"></i></div><div><p class="text-slate-500 text-sm font-medium">Serviços</p><p class="text-2xl font-bold text-slate-800">${window.localData.reports.length}</p></div></div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="fas fa-file-invoice-dollar"></i></div><div><p class="text-slate-500 text-sm font-medium">Orçamentos</p><p class="text-2xl font-bold text-slate-800">${window.localData.quotes.length}</p></div></div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-2xl"><i class="fas fa-handshake"></i></div><div><p class="text-slate-500 text-sm font-medium">Terceiros</p><p class="text-2xl font-bold text-slate-800">${window.localData.thirdParty.length}</p></div></div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4"><div class="w-14 h-14 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl"><i class="fas fa-school"></i></div><div><p class="text-slate-500 text-sm font-medium">Creches</p><p class="text-2xl font-bold text-slate-800">${window.localData.ceis.length}</p></div></div>
            </div>`;

        const renderAdminCeis = () => {

        window.addMaterialRow = (containerId) => {

        window.handlePhotoSelection = (e, previewId) => {
            const c = document.getElementById(previewId); c.innerHTML = "";
            Array.from(e.target.files).forEach(file => {
                if(file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (ev) => { c.innerHTML += `<img src="${ev.target.result}" class="h-16 w-16 object-cover rounded shadow border">`; };
                    reader.readAsDataURL(file);
                }
            });
        };

        window.sendToTelegram = async (ceiId, dataObj, base64Photos, isEdit, typeLabel) => {
            const cei = window.localData.ceis.find(c => c.id === ceiId);
            if(!cei || !cei.telegramGroupId || cei.telegramGroupId.trim() === "") return false;
            
            const chatId = cei.telegramGroupId.trim();
            const topicId = cei.telegramTopicId ? cei.telegramTopicId.trim() : null;
            
            let totalValue = 0; let materialText = "";
            if(dataObj.materials) {
                dataObj.materials.forEach(m => {
                    let v = parseFloat(m.price || 0); totalValue += (v * m.qtd);
                    materialText += `- ${m.qtd}x ${m.name} (${m.brand}) - R$ ${(v * m.qtd).toFixed(2)}\n`;
                });
            }

            let headerTag = isEdit ? "🔄 <b>[CORREÇÃO DE SERVIÇO]</b>\n" : `🛠 <b>NOVO: ${typeLabel}</b>\n`;
            let tgText = `${headerTag}🏫 <b>CEI:</b> ${cei.name}\n👨‍🔧 <b>Técnico:</b> ${dataObj.userName}\n📅 <b>Data:</b> ${window.formatDateBR(dataObj.date)}\n`;
            if (dataObj.timeStart) tgText += `🕒 <b>Horário:</b> ${dataObj.timeStart} às ${dataObj.timeEnd}\n`;
            if (dataObj.workDone) tgText += `\n🛠 <b>Descrição/Serviço:</b>\n${dataObj.workDone}\n`;
            if (dataObj.materials && dataObj.materials.length > 0) tgText += `\n📦 <b>Materiais:</b>\n${materialText}<b>TOTAL MATERIAIS: R$ ${totalValue.toFixed(2)}</b>\n`;
            if (dataObj.obs) tgText += `\n📌 <b>Obs:</b> ${dataObj.obs}\n`;

            try {
                // Enviar Texto
                const payload = { chat_id: chatId, text: tgText, parse_mode: 'HTML' };
                if (topicId) payload.message_thread_id = topicId;
                const rTxt = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                if (!rTxt.ok) return false;

                // Gerar PDF na tela de fundo
                const pdfDiv = document.createElement('div');
                pdfDiv.style.position = 'absolute'; pdfDiv.style.left = '-9999px'; pdfDiv.style.top = '-9999px'; pdfDiv.style.width = '800px'; document.body.appendChild(pdfDiv);
                
                let matsHtml = '';
                if(dataObj.materials && dataObj.materials.length > 0) {
                    matsHtml = `<table style="width:100%; border-collapse:collapse; margin-top:20px; font-size:14px;"><tr style="background:#e2e8f0;"><th style="padding:10px; border:1px solid #cbd5e1; text-align:left;">Material</th><th style="padding:10px; border:1px solid #cbd5e1;">Qtd</th><th style="padding:10px; border:1px solid #cbd5e1; text-align:right;">Total (R$)</th></tr>${dataObj.materials.map(m => `<tr><td style="padding:10px; border:1px solid #cbd5e1;">${m.name}</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:center;">${m.qtd}</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:right;">${(parseFloat(m.price||0)*m.qtd).toFixed(2)}</td></tr>`).join('')}<tr style="background:#f1f5f9;"><td colspan="2" style="padding:10px; border:1px solid #cbd5e1; text-align:right; font-weight:bold;">TOTAL:</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:right; font-weight:bold;">R$ ${totalValue.toFixed(2)}</td></tr></table>`;
                }

                let imgsHtml = '';
                if(base64Photos && base64Photos.length > 0) imgsHtml = `<div style="display:flex; flex-wrap:wrap; gap:15px; margin-top:20px;">${base64Photos.map(i => `<img src="${i}" style="height:250px; border-radius:5px; border:1px solid #cbd5e1;">`).join('')}</div>`;

                pdfDiv.innerHTML = `<div style="padding:40px; font-family:sans-serif; color:#334155;"><h1 style="color:#1d4ed8; border-bottom:3px solid #1d4ed8; padding-bottom:10px;">LYM Eletrônicos - ${typeLabel}</h1>${isEdit ? '<h2 style="color:#eab308; margin-top:10px;">[REGISTRO CORRIGIDO/EDITADO]</h2>' : ''}<table style="width:100%; margin:20px 0; font-size:16px;"><tr><td style="padding:5px 0;"><strong>Creche (CEI):</strong> ${cei.name}</td><td style="padding:5px 0;"><strong>Data:</strong> ${window.formatDateBR(dataObj.date)}</td></tr><tr><td style="padding:5px 0;"><strong>Técnico:</strong> ${dataObj.userName}</td><td style="padding:5px 0;"><strong>Horário:</strong> ${dataObj.timeStart || '--:--'} às ${dataObj.timeEnd || '--:--'}</td></tr></table><div style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0;"><h3 style="margin-top:0; color:#0f172a;">Descrição / Serviço Realizado</h3><p style="margin-bottom:0; line-height:1.5;">${dataObj.workDone || 'Sem descrição.'}</p></div>${matsHtml}${imgsHtml}</div>`;

                const opt = { margin: 10, filename: `Relatorio_${cei.name.replace(/[^a-z0-9]/gi, '_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                let pdfBlob = await html2pdf().set(opt).from(pdfDiv).outputPdf('blob');
                document.body.removeChild(pdfDiv); 

                const fData = new FormData();
                fData.append('chat_id', chatId);
                if (topicId) fData.append('message_thread_id', topicId);
                fData.append('document', pdfBlob, opt.filename);
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: fData });
                return true;
            } catch (err) { return false; }
        };

        window.saveRecord = async (e, type) => {
            e.preventDefault();
            const btnId = type === 'reports' ? 'btnSubmitReport' : (type === 'quotes' ? 'btnSubmitQuote' : 'btnSubmitThirdParty');
            const typeLabel = type === 'reports' ? 'Manutenção' : (type === 'quotes' ? 'Orçamento' : 'Acompanhamento');
            const btn = document.getElementById(btnId);
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...'; btn.disabled = true;

            try {
                const sffx = type === 'reports' ? 'Rep' : (type === 'quotes' ? 'Quote' : 'ThirdParty');
                const editId = document.getElementById(`editId${type}`).value;
                const isEdit = !!editId;
                const recordId = editId || Date.now().toString();
                
                const selectElement = document.getElementById(`ceiSelect${sffx}`);
                const ceiId = selectElement.options[selectElement.selectedIndex]?.dataset.id;
                
                const recordData = {
                    id: recordId, userId: window.currentSystemUser.id, userName: window.currentSystemUser.login,
                    cei: selectElement.value, ceiId: ceiId, date: document.getElementById(`date${sffx}`).value,
                    workDone: document.getElementById(`workDone${sffx}`).value, obs: document.getElementById(`obs${sffx}`).value || "", timestamp: new Date().toISOString()
                };

                if(type === 'reports' || type === 'thirdParty') { recordData.timeStart = document.getElementById(`timeStart${sffx}`).value; recordData.timeEnd = document.getElementById(`timeEnd${sffx}`).value; }
                if(type === 'thirdParty') recordData.companyName = document.getElementById('companyNameThirdParty').value;
                if(type === 'reports') recordData.difficulty = document.getElementById('diffRep').value;

                if(type === 'reports' || type === 'quotes') {
                    const contId = type === 'reports' ? 'materialsContainer' : 'quoMaterialsContainer';
                    const mats = [];
                    document.getElementById(contId).querySelectorAll('[id^="mat_"]').forEach(row => {
                        mats.push({ name: row.querySelector('.mat-name').value, brand: row.querySelector('.mat-brand').value, qtd: row.querySelector('.mat-qtd').value, price: row.querySelector('.mat-price').value });
                    });
                    recordData.materials = mats;
                }

                let base64Photos = [];
                const fileInput = document.getElementById(type === 'reports' ? 'photosRep' : (type === 'quotes' ? 'photosQuote' : 'photosThirdParty'));
                
                if (fileInput && fileInput.files.length > 0) {
                    for(let file of fileInput.files) base64Photos.push(await window.compressImage(file));
                } else if (isEdit) {
                    const oldR = window.localData[type].find(r => r.id === editId);
                    if(oldR && oldR.photos) base64Photos = oldR.photos;
                }
                
                if (ceiId) {
                    const tgSent = await window.sendToTelegram(ceiId, recordData, base64Photos, isEdit, typeLabel);
                    if (tgSent) { recordData.telegramSent = true; base64Photos = []; } 
                    else { recordData.telegramSent = false; recordData.photos = base64Photos; }
                } else { recordData.photos = base64Photos; }

                await window.dbSave(type, recordId, recordData);
                window.logAudit(`${isEdit ? 'Editou' : 'Registrou'} ${typeLabel} ID: ${recordId}`);
                window.showToast("Salvo e Enviado!", "success");
                
                if (isEdit) window.cancelEdit();
                else {
                    document.getElementById(`${type === 'reports' ? 'reportForm' : (type==='quotes'?'quoteForm':'thirdPartyForm')}`).reset();
                    if(type === 'reports') { document.getElementById('materialsContainer').innerHTML = '<p class="text-sm italic text-slate-500">Nenhum material.</p>'; document.getElementById('repPhotoPreview').innerHTML = ''; }
                    if(type === 'quotes') { document.getElementById('quoMaterialsContainer').innerHTML = '<p class="text-sm italic text-slate-500">Nenhum material.</p>'; document.getElementById('quoPhotoPreview').innerHTML = ''; }
                    if(type === 'thirdParty') document.getElementById('tpPhotoPreview').innerHTML = '';
                }
            } catch (err) { console.error(err); window.showToast("Erro ao salvar", "error"); } 
            finally { btn.innerHTML = originalBtnText; btn.disabled = false; }
        };

        // ==========================================
        // FILTROS, VISUALIZAÇÃO E EXPORTAÇÃO
        // ==========================================
        let currentFilteredData = [];
        window.setupAdminFilters = () => { window.applyFilters(window.activeTab.split('-')[1]); };
        
        window.applyFilters = (type) => {
            const search = document.getElementById('filterSearch')?.value.toLowerCase() || "";
            const start = document.getElementById('filterDateStart')?.value || "";
            const end = document.getElementById('filterDateEnd')?.value || "";
            
            let data = [...window.localData[type]];
            if(search) {
                data = data.filter(item => (item.cei && item.cei.toLowerCase().includes(search)) || (item.userName && item.userName.toLowerCase().includes(search)) || (item.companyName && item.companyName.toLowerCase().includes(search)) || (item.workDone && item.workDone.toLowerCase().includes(search)));
            }
            if(start) data = data.filter(item => item.date >= start);
            if(end) data = data.filter(item => item.date <= end);
            
            data.sort((a,b) => new Date(b.date) - new Date(a.date));
            currentFilteredData = data; 
            
            const tbody = document.getElementById(`tableBody${type.charAt(0).toUpperCase() + type.slice(1)}`);
            if(!tbody) return;
            
            tbody.innerHTML = data.map(item => {
                let col3 = type === 'reports' ? item.userName : (type === 'quotes' ? window.formatMoney(item.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0)) : item.companyName);
                return `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4">${window.formatDateBR(item.date)}</td><td class="p-4 font-medium">${item.cei}</td><td class="p-4 text-slate-600 capitalize">${col3}</td><td class="p-4 text-right"><button onclick="window.viewRecord('${type}', '${item.id}')" class="text-blue-500 bg-blue-50 hover:bg-blue-100 px-3 py-1 rounded shadow-sm"><i class="fas fa-eye mr-1"></i>Ver</button></td></tr>`;
            }).join("") || `<tr><td colspan="4" class="p-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
        };

        window.exportToExcel = (type) => {
            if(currentFilteredData.length === 0) return window.showToast("Nenhum dado para exportar", "error");
            let exportData = [];
            if(type === 'reports') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Tecnico: r.userName, Inicio: r.timeStart, Termino: r.timeEnd, Dificuldade: r.difficulty, Servico: r.workDone, Materiais: r.materials ? r.materials.map(m => `${m.qtd}x ${m.name} (${m.brand}) R$${m.price}`).join(" | ") : "", TotalGasto: r.materials ? r.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0) : 0, Observacao: r.obs, Telegram: r.telegramSent ? "Sim" : "Não" }));
            } else if (type === 'quotes') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Tecnico: r.userName, Descricao: r.workDone, Materiais: r.materials ? r.materials.map(m => `${m.qtd}x ${m.name} R$${m.price}`).join(" | ") : "", Total_Orcado: r.materials ? r.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0) : 0, Observacao: r.obs }));
            } else if (type === 'thirdParty') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Funcionario_Acompanhante: r.userName, Empresa_Terceirizada: r.companyName, Inicio: r.timeStart, Termino: r.timeEnd, Servico_Realizado: r.workDone, Observacao: r.obs }));
            }
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Relatório");
            XLSX.writeFile(wb, `LYM_${type}_${new Date().getTime()}.xlsx`);
            window.logAudit(`Exportou Excel: ${type}`);
        };

        window.viewRecord = (type, id) => {
            const record = window.localData[type].find(r => r.id === id); if(!record) return;
            const btnPrint = document.getElementById('btnPrintRecord');
            if(type === 'quotes') { btnPrint.classList.remove('hidden'); btnPrint.onclick = () => window.printQuote(record); } else { btnPrint.classList.add('hidden'); }

            let html = `<div class="grid grid-cols-2 gap-y-2 text-sm mb-6 bg-slate-50 p-4 rounded border"><div><span class="font-bold text-slate-500">Data:</span> ${window.formatDateBR(record.date)}</div><div><span class="font-bold text-slate-500">CEI:</span> ${record.cei}</div><div><span class="font-bold text-slate-500">Registro por:</span> <span class="capitalize">${record.userName}</span></div>`;
            if(type === 'reports' || type === 'thirdParty') html += `<div><span class="font-bold text-slate-500">Horário:</span> ${record.timeStart} às ${record.timeEnd}</div>`;
            if(type === 'thirdParty') html += `<div class="col-span-2"><span class="font-bold text-slate-500">Empresa:</span> ${record.companyName}</div>`;
            if(type === 'reports') html += `<div><span class="font-bold text-slate-500">Dificuldade:</span> ${record.difficulty}/5</div>`;
            html += `</div>`;

            if(record.workDone) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Serviço Realizado / Descrição</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-slate-50 p-3 rounded border">${record.workDone}</p>`;

            if(record.materials && record.materials.length > 0) {
                html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Materiais / Custos</h4><table class="w-full text-sm text-left mb-6 border"><thead class="bg-slate-100"><tr><th class="p-2 border">Qtd</th><th class="p-2 border">Material</th><th class="p-2 border text-right">R$ Un.</th><th class="p-2 border text-right">Total</th></tr></thead><tbody>`;
                let totalGeral = 0;
                record.materials.forEach(m => {
                    const price = parseFloat(m.price || 0); const q = parseFloat(m.qtd || 1); const total = price * q; totalGeral += total;
                    html += `<tr><td class="p-2 border">${m.qtd}</td><td class="p-2 border">${m.name} (${m.brand||'-'})</td><td class="p-2 border text-right">${window.formatMoney(price)}</td><td class="p-2 border font-medium text-right">${window.formatMoney(total)}</td></tr>`;
                });
                if(type === 'reports' || type === 'quotes') html += `<tr class="bg-blue-50"><td colspan="3" class="p-2 border text-right font-bold">TOTAL:</td><td class="p-2 border font-bold text-blue-700 text-right text-lg">${window.formatMoney(totalGeral)}</td></tr>`;
                html += `</tbody></table>`;
            }

            if(record.obs) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Observações</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-yellow-50 p-3 border border-yellow-200 rounded">${record.obs}</p>`;

            if(record.telegramSent) {
                html += `<div class="bg-green-50 text-green-700 p-3 rounded-lg flex items-center gap-2 mt-4 border border-green-200 font-medium"><i class="fab fa-telegram text-xl"></i> PDF e Fotos enviados com sucesso para o Telegram da creche.</div>`;
            } else if(record.photos && record.photos.length > 0) {
                html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Fotos (Banco Local)</h4><div class="grid grid-cols-3 gap-2">`;
                record.photos.forEach(b64 => { html += `<a href="${b64}" target="_blank" class="block border rounded p-1 hover:border-blue-500 transition"><img src="${b64}" class="w-full h-24 object-cover rounded"></a>`; });
                html += `</div>`;
            }

            document.getElementById('viewRecordContent').innerHTML = html;
            window.showElement('modalViewRecord');
        };

        window.printQuote = (record) => {
            const printArea = document.getElementById('printArea');
            let totalGeral = record.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0);
            let matHtml = record.materials.map(m => `<tr style="border-bottom: 1px solid #ddd;"><td style="padding: 12px 8px;">${m.qtd}</td><td style="padding: 12px 8px;">${m.name} ${m.brand ? '('+m.brand+')' : ''}</td><td style="padding: 12px 8px;">${window.formatMoney(m.price)}</td><td style="padding: 12px 8px; text-align:right;">${window.formatMoney(m.qtd * m.price)}</td></tr>`).join('');

            printArea.innerHTML = `<div style="font-family: Arial, sans-serif; color: #333; max-width: 800px; margin: 0 auto; line-height: 1.5;"><div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #2563eb; padding-bottom: 20px; margin-bottom: 30px;"><div><h1 style="margin:0; font-size: 28px; color:#1e293b;">LYM Eletrônicos</h1><p style="margin:5px 0 0; color:#64748b;">Orçamento Comercial</p></div><div style="text-align: right; color:#64748b; font-size:14px;"><p style="margin:0;">Data: <strong>${window.formatDateBR(record.date)}</strong></p><p style="margin:0;">Ref: #LYM-${record.id.substring(record.id.length-6)}</p></div></div><div style="background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e2e8f0;"><p style="margin:0 0 10px;"><strong>Cliente / Local:</strong> ${record.cei}</p><p style="margin:0 0 10px;"><strong>Técnico Responsável:</strong> <span style="text-transform:capitalize;">${record.userName}</span></p>${record.workDone ? `<p style="margin:0;"><strong>Descrição do Serviço:</strong><br>${record.workDone.replace(/\n/g, '<br>')}</p>` : ''}</div><table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;"><thead><tr style="background: #1e293b; color: white; text-align: left;"><th style="padding: 12px 8px;">Qtd</th><th style="padding: 12px 8px;">Descrição do Material/Serviço</th><th style="padding: 12px 8px;">Valor Un.</th><th style="padding: 12px 8px; text-align:right;">Subtotal</th></tr></thead><tbody>${matHtml}<tr style="background: #f1f5f9; font-weight: bold; font-size: 18px;"><td colspan="3" style="padding: 15px 8px; text-align: right; color: #0f172a;">TOTAL DO ORÇAMENTO:</td><td style="padding: 15px 8px; text-align:right; color: #2563eb;">${window.formatMoney(totalGeral)}</td></tr></tbody></table>${record.obs ? `<div style="margin-bottom: 40px; padding-top:20px; border-top: 1px solid #e2e8f0;"><p style="margin:0;"><strong>Observações Importantes:</strong><br>${record.obs.replace(/\n/g, '<br>')}</p></div>` : ''}<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:50px; border-top: 1px solid #e2e8f0; padding-top:20px;">Este orçamento é válido por 15 dias. Qualquer alteração no escopo poderá gerar reajuste nos valores.</div></div>`;
            window.print();
        };

        // HISTÓRICO DE FUNCIONÁRIOS E MANUSEIOS
        window.renderEmployeeHistory = () => {
            if(!window.currentSystemUser) return;
            const uid = window.currentSystemUser.id;
            
            const renderRows = (type, tbodyId) => {
                const tbody = document.getElementById(tbodyId); if(!tbody) return;
                const myData = window.localData[type].filter(r => r.userId === uid).sort((a,b) => new Date(b.date) - new Date(a.date));
                tbody.innerHTML = myData.map(r => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-3">${window.formatDateBR(r.date)}</td><td class="p-3 font-medium">${r.cei}</td><td class="p-3 text-right space-x-1"><button onclick="window.editFuncRecord('${type}','${r.id}')" class="bg-blue-100 text-blue-700 p-2 rounded hover:bg-blue-200 shadow-sm"><i class="fas fa-edit"></i></button><button onclick="window.deleteFuncRecord('${type}','${r.id}')" class="bg-red-100 text-red-700 p-2 rounded hover:bg-red-200 shadow-sm"><i class="fas fa-trash"></i></button></td></tr>`).join("") || `<tr><td colspan="3" class="p-6 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
            };

            renderRows('reports', 'empHistoryReports');
            renderRows('quotes', 'empHistoryQuotes');
            renderRows('thirdParty', 'empHistoryThirdParty');
        };

        window.cancelEdit = () => { window.editingItemId = null; window.activeTab = 'func-history'; window.renderActiveTab(); };

        window.editFuncRecord = (type, id) => {
            const record = window.localData[type].find(r => r.id === id); if(!record) return;
            if(type === 'reports') window.activeTab = 'func-reports';
            if(type === 'quotes') window.activeTab = 'func-quotes';
            if(type === 'thirdParty') window.activeTab = 'func-thirdParty';
            window.renderActiveTab();
            
            setTimeout(() => {
                const sffx = type === 'reports' ? 'Rep' : (type === 'quotes' ? 'Quote' : 'ThirdParty');
                window.editingItemId = record.id;
                document.getElementById(`editId${type}`).value = record.id;
                
                const selectCei = document.getElementById(`ceiSelect${sffx}`);
                const opt = Array.from(selectCei.options).find(o => o.value === record.cei);
                if(opt) selectCei.value = opt.value;
                
                document.getElementById(`date${sffx}`).value = record.date;
                document.getElementById(`workDone${sffx}`).value = record.workDone;
                if(record.obs) document.getElementById(`obs${sffx}`).value = record.obs;
                
                if(type === 'reports' || type === 'thirdParty') { document.getElementById(`timeStart${sffx}`).value = record.timeStart; document.getElementById(`timeEnd${sffx}`).value = record.timeEnd; }
                if(type === 'thirdParty') document.getElementById('companyNameThirdParty').value = record.companyName;
                if(type === 'reports') { document.getElementById('diffRep').value = record.difficulty; document.getElementById('diffVal').textContent = record.difficulty; }
                
                if((type === 'reports' || type === 'quotes') && record.materials) {
                    const contId = type === 'reports' ? 'materialsContainer' : 'quoMaterialsContainer';
                    document.getElementById(contId).innerHTML = '';
                    record.materials.forEach(m => {
                        window.addMaterialRow(contId); const lastRow = document.getElementById(`mat_${window.materialCount}`);
                        lastRow.querySelector('.mat-name').value = m.name; if(m.brand) lastRow.querySelector('.mat-brand').value = m.brand;
                        lastRow.querySelector('.mat-qtd').value = m.qtd; if(m.price) lastRow.querySelector('.mat-price').value = m.price;
                    });
                }
                document.getElementById(`formTitle${type.charAt(0).toUpperCase() + type.slice(1)}`).textContent = `Editando ${type === 'reports' ? 'Serviço' : (type==='quotes'?'Orçamento':'Acompanhamento')}`;
                window.showElement('cancelEditBtn');
            }, 100);
        };

        window.deleteFuncRecord = (type, id) => { window.confirmAction(async () => { await window.dbDelete(type, id); window.logAudit(`Funcionário excluiu seu ${type} ID: ${id}`); window.showToast("Registro excluído!"); window.renderEmployeeHistory(); }); };

        // Cadastro CEI/USUARIO pelo Admin
        window.openCeiModal = () => { window.editingItemId = null; document.getElementById('ceiForm').reset(); document.getElementById('modalTitleCei').textContent = "Nova Creche (CEI)"; window.showElement('modalCei'); };
        window.editCei = (id) => { const c = window.localData.ceis.find(x => x.id === id); if(c) { window.editingItemId = id; document.getElementById('ceiName').value = c.name; document.getElementById('ceiTelegramId').value = c.telegramGroupId || ""; document.getElementById('ceiTelegramTopicId').value = c.telegramTopicId || ""; document.getElementById('modalTitleCei').textContent = "Editar Creche (CEI)"; window.showElement('modalCei'); } };
        window.saveCei = async (e) => { e.preventDefault(); const n = document.getElementById('ceiName').value.trim(); const tg = document.getElementById('ceiTelegramId').value.trim(); const tp = document.getElementById('ceiTelegramTopicId').value.trim(); if(!n) return; const id = window.editingItemId || Date.now().toString(); await window.dbSave('ceis', id, { id, name: n, telegramGroupId: tg, telegramTopicId: tp }); window.logAudit(window.editingItemId ? `CEI Editado: ${n}` : `CEI Criado: ${n}`); window.showToast("CEI salvo!"); window.hideElement('modalCei'); };
        window.deleteCei = (id) => { window.confirmAction(async () => { await window.dbDelete('ceis', id); window.logAudit(`CEI Excluído ID: ${id}`); window.showToast("CEI excluído!"); }); };

        window.openUserModal = () => { window.editingItemId = null; document.getElementById('userForm').reset(); document.getElementById('modalTitleUser').textContent = "Novo Usuário"; window.showElement('modalUser'); };
        window.editUser = (id) => { const u = window.localData.users.find(x => x.id === id); if(u) { window.editingItemId = id; document.getElementById('newUsername').value = u.login || u.username; document.getElementById('newPassword').value = u.pass || u.password; document.getElementById('newRole').value = u.role; document.getElementById('modalTitleUser').textContent = "Editar Usuário"; window.showElement('modalUser'); } };
        window.saveUser = async (e) => { e.preventDefault(); const u = document.getElementById('newUsername').value.trim(); const p = document.getElementById('newPassword').value.trim(); const r = document.getElementById('newRole').value; if(!u || !p) return; const id = window.editingItemId || Date.now().toString(); await window.dbSave('users', id, { id, login: u, pass: p, role: r }); window.logAudit(window.editingItemId ? `Usuário Editado: ${u}` : `Usuário Criado: ${u}`); window.showToast("Usuário salvo!"); window.hideElement('modalUser'); };
        window.deleteUser = (id) => { if(id === window.currentSystemUser.id) return window.showToast("Não pode excluir a si mesmo", "error"); window.confirmAction(async () => { await window.dbDelete('users', id); window.logAudit(`Usuário Excluído ID: ${id}`); window.showToast("Usuário excluído!"); }); };

        // INICIALIZAÇÃO
        window.onload = () => { window.initFirebaseSync(); };
    </script>
</body>
</html>
