    <!-- Bibliotecas Externas -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" crossorigin="anonymous"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        
        /* Otimizações para Touch no Celular */
        button, input, select { touch-action: manipulation; }
        input, select, textarea { font-size: 16px !important; } /* Evita zoom automático no iPhone */
        
        .toast { transition: all 0.3s ease-in-out; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.hide { transform: translateY(100%); opacity: 0; }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Esconder tudo na hora de imprimir, exceto a área de impressão */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen flex overflow-hidden">

    <!-- APLICATIVO PRINCIPAL -->
    <div id="appLayout" class="hidden w-full h-full flex flex-col md:flex-row">
        
        <!-- Sidebar (Menu Lateral) -->
        <nav class="bg-slate-900 text-white w-full md:w-64 flex-shrink-0 flex flex-col transition-all duration-300 z-20">
            <div class="p-4 sm:p-6 flex items-center justify-between md:justify-center border-b border-slate-700">

        <!-- Área de Conteúdo Central -->

    <!-- Modal Cadastro CEI -->

    <!-- Modal Cadastro Usuário -->

    <!-- Modal Visualização de Registro (Admin) -->
    <div id="modalViewRecord" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in my-8">
            <div class="bg-slate-100 px-6 py-4 border-b flex justify-between items-center sticky top-0 z-10">
                <h3 class="font-bold text-lg" id="viewRecordTitle">Detalhes</h3>
                <div class="flex gap-2">
                    <button id="btnPrintRecord" class="hidden px-3 py-1 bg-slate-800 text-white text-sm rounded hover:bg-slate-700"><i class="fas fa-print"></i> Imprimir</button>
                    <button onclick="window.hideElement('modalViewRecord')" class="text-slate-500 hover:text-slate-800"><i class="fas fa-times text-xl"></i></button>
                </div>

            <div id="viewRecordContent" class="p-6">
                <!-- Conteúdo dinâmico preenchido via JS -->

    <!-- Modal de Confirmação (Genérico) -->
    <div id="modalConfirm" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm overflow-hidden animate-fade-in text-center p-6">
            <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 class="font-bold text-lg mb-2">Tem certeza?</h3>
            <p class="text-slate-500 mb-6 text-sm">Esta ação não pode ser desfeita.</p>
            <div class="flex justify-center gap-3">
                <button onclick="window.hideElement('modalConfirm')" class="px-5 py-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg font-medium">Cancelar</button>
                <button id="btnConfirmAction" class="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium">Sim, Excluir</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT PRINCIPAL E FIREBASE (MÓDULOS) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Configuração do seu Banco de Dados Real no Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyCLYjq-4yOXL-_GZ8vWAR_4GpV6wa5l6OM",
            authDomain: "lym-manutencao.firebaseapp.com",
            projectId: "lym-manutencao",
            storageBucket: "lym-manutencao.firebasestorage.app",
            messagingSenderId: "172405408906",
            appId: "1:172405408906:web:19ef22e87e8ecbe1d91973",
            measurementId: "G-BECF0MECZ7"
        };

        // Token do Bot do Telegram
        const TELEGRAM_BOT_TOKEN = "8891515283:AAFhFKktpfr6wEQUF1UXCUcOJecAg8m7nKY";

        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Estado Global da Aplicação
        window.currentSystemUser = null; 
        window.activeTab = 'dashboard';
        window.editingItemId = null; 
        window.localData = { ceis: [], users: [], reports: [], quotes: [], thirdParty: [], audit: [] };
        window.unsubscribers = [];

        // Referências DOM
        const loginScreen = document.getElementById('loginScreen');
        const appLayout = document.getElementById('appLayout');
        const mainContent = document.getElementById('mainContent');
        const navLinks = document.getElementById('navLinks');

        // Utilitários de Janela (Atachados ao window para o HTML poder chamar)
        window.showElement = (id) => document.getElementById(id).classList.remove('hidden');
        window.hideElement = (id) => document.getElementById(id).classList.add('hidden');
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-green-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            toast.className = `${colorClass} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 transform translate-y-full opacity-0 transition-all duration-300 animate-fade-in`;
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> <span class="font-medium">${msg}</span><button onclick="this.parentElement.remove()" class="ml-4 opacity-75 hover:opacity-100"><i class="fas fa-times"></i></button>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-full', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 4000);
        };
        
        window.formatDateBR = (isoString) => {
            if(!isoString) return "";
            const [year, month, day] = isoString.split('-');
            return `${day}/${month}/${year}`;
        };

        window.formatMoney = (val) => {
            return parseFloat(val).toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        };

        // Compressão de Imagem para Base64
        window.compressImage = (file, maxWidth = 800, quality = 0.7) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
                reader.onerror = error => reject(error);
            });
        };

        // Sistema de Confirmação
        let confirmActionCallback = null;
        window.confirmAction = (callback) => {
            confirmActionCallback = callback;
            window.showElement('modalConfirm');
        };
        document.getElementById('btnConfirmAction').addEventListener('click', () => {
            if(confirmActionCallback) confirmActionCallback();
            window.hideElement('modalConfirm');
            confirmActionCallback = null;
        });

        // -------------------------------------------------------------
        // INTEGRAÇÃO TELEGRAM COM GERAÇÃO DE PDF INVISÍVEL E FLAG DE EDIÇÃO
        // -------------------------------------------------------------
        window.sendToTelegram = async (ceiId, dataObj, base64Photos, isEdit, typeLabel) => {
            const cei = window.localData.ceis.find(c => c.id === ceiId);
            if(!cei || !cei.telegramGroupId || cei.telegramGroupId.trim() === "") {
                console.log("Telegram ignorado: CEI sem grupo configurado.");
                return false;
            }
            
            const chatId = cei.telegramGroupId.trim();
            const topicId = cei.telegramTopicId ? cei.telegramTopicId.trim() : null;
            
            let totalValue = 0; let materialText = "";
            if(dataObj.materials) {
                dataObj.materials.forEach(m => {
                    let v = parseFloat(m.price || 0); totalValue += (v * m.qtd);
                    materialText += `- ${m.qtd}x ${m.name} (${m.brand}) - R$ ${(v * m.qtd).toFixed(2)}\n`;
                });
            }

            // Flag visual de Edição
            let headerTag = isEdit ? "🔄 <b>[CORREÇÃO DE SERVIÇO]</b>\n" : `🛠 <b>NOVO: ${typeLabel}</b>\n`;
            let tgText = `${headerTag}🏫 <b>CEI:</b> ${cei.name}\n👨‍🔧 <b>Técnico:</b> ${dataObj.userName}\n📅 <b>Data:</b> ${window.formatDateBR(dataObj.date)}\n`;
            if (dataObj.timeStart) tgText += `🕒 <b>Horário:</b> ${dataObj.timeStart} às ${dataObj.timeEnd}\n`;
            if (dataObj.workDone) tgText += `\n🛠 <b>Descrição/Serviço:</b>\n${dataObj.workDone}\n`;
            if (dataObj.materials && dataObj.materials.length > 0) tgText += `\n📦 <b>Materiais:</b>\n${materialText}<b>TOTAL MATERIAIS: R$ ${totalValue.toFixed(2)}</b>\n`;
            if (dataObj.obs) tgText += `\n📌 <b>Obs:</b> ${dataObj.obs}\n`;

            try {
                // 1. Enviar Texto Informativo
                const payload = { chat_id: chatId, text: tgText, parse_mode: 'HTML' };
                if (topicId) payload.message_thread_id = topicId;

                const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
                });
                if (!response.ok) return false;

                // 2. Gerar Layout PDF na memória
                const pdfDiv = document.createElement('div');
                pdfDiv.style.position = 'absolute'; pdfDiv.style.left = '-9999px'; pdfDiv.style.top = '-9999px'; pdfDiv.style.width = '800px';
                document.body.appendChild(pdfDiv);
                
                let matsHtml = '';
                if(dataObj.materials && dataObj.materials.length > 0) {
                    matsHtml = `<table style="width:100%; border-collapse:collapse; margin-top:20px; font-size:14px;">
                        <tr style="background:#e2e8f0;"><th style="padding:10px; border:1px solid #cbd5e1; text-align:left;">Material</th><th style="padding:10px; border:1px solid #cbd5e1;">Qtd</th><th style="padding:10px; border:1px solid #cbd5e1; text-align:right;">Total (R$)</th></tr>
                        ${dataObj.materials.map(m => `<tr><td style="padding:10px; border:1px solid #cbd5e1;">${m.name}</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:center;">${m.qtd}</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:right;">${(parseFloat(m.price||0)*m.qtd).toFixed(2)}</td></tr>`).join('')}
                        <tr style="background:#f1f5f9;"><td colspan="2" style="padding:10px; border:1px solid #cbd5e1; text-align:right; font-weight:bold;">TOTAL:</td><td style="padding:10px; border:1px solid #cbd5e1; text-align:right; font-weight:bold;">R$ ${totalValue.toFixed(2)}</td></tr>
                        </table>`;
                }

                let imgsHtml = '';
                if(base64Photos && base64Photos.length > 0) {
                    imgsHtml = `<div style="display:flex; flex-wrap:wrap; gap:15px; margin-top:20px;">
                        ${base64Photos.map(i => `<img src="${i}" style="height:250px; border-radius:5px; border:1px solid #cbd5e1;">`).join('')}
                    </div>`;
                }

                pdfDiv.innerHTML = `
                    <div style="padding:40px; font-family:sans-serif; color:#334155;">
                        <h1 style="color:#1d4ed8; border-bottom:3px solid #1d4ed8; padding-bottom:10px;">LYM Eletrônicos - ${typeLabel}</h1>
                        ${isEdit ? '<h2 style="color:#eab308; margin-top:10px;">[REGISTRO CORRIGIDO/EDITADO]</h2>' : ''}
                        
                        <table style="width:100%; margin:20px 0; font-size:16px;">
                            <tr><td style="padding:5px 0;"><strong>Creche (CEI):</strong> ${cei.name}</td>
                                <td style="padding:5px 0;"><strong>Data:</strong> ${window.formatDateBR(dataObj.date)}</td></tr>
                            <tr><td style="padding:5px 0;"><strong>Técnico:</strong> ${dataObj.userName}</td>
                                <td style="padding:5px 0;"><strong>Horário:</strong> ${dataObj.timeStart || '--:--'} às ${dataObj.timeEnd || '--:--'}</td></tr>
                        </table>
                        
                        <div style="background:#f8fafc; padding:20px; border-radius:8px; border:1px solid #e2e8f0;">
                            <h3 style="margin-top:0; color:#0f172a;">Descrição / Serviço Realizado</h3>
                            <p style="margin-bottom:0; line-height:1.5;">${dataObj.workDone || 'Sem descrição.'}</p>
                        </div>
                        ${matsHtml}
                        ${imgsHtml}
                    </div>
                `;

                // 3. Gerar Arquivo e enviar
                const opt = { margin: 10, filename: `Relatorio_${cei.name.replace(/[^a-z0-9]/gi, '_')}.pdf`, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
                let pdfBlob = await html2pdf().set(opt).from(pdfDiv).outputPdf('blob');
                document.body.removeChild(pdfDiv); 

                const fData = new FormData();
                fData.append('chat_id', chatId);
                if (topicId) fData.append('message_thread_id', topicId);
                fData.append('document', pdfBlob, opt.filename);
                
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument`, { method: 'POST', body: fData });
                return true;
            } catch (err) {
                console.error("Falha no Telegram PDF:", err);
                return false;
            }
        };

        // Funções de Banco Firebase
        const getColRef = (colName) => collection(db, colName);
        const getDocRef = (colName, docId) => doc(db, colName, docId);

        window.dbSave = async (colName, docId, data) => {
            data.updatedAt = new Date().toISOString();
            await setDoc(getDocRef(colName, docId), data, { merge: true });
        };
        
        window.dbDelete = async (colName, docId) => {
            await deleteDoc(getDocRef(colName, docId));
        };

        // Sincronização e Renderização
        const setupRealtimeSync = () => {
            const collections = ['ceis', 'users', 'reports', 'quotes', 'thirdParty', 'audit'];
            collections.forEach(col => {
                const unsub = onSnapshot(getColRef(col), (snapshot) => {
                    const items = [];
                    snapshot.forEach(doc => items.push(doc.data()));
                    window.localData[col] = items;
                    
                    if (col === 'users' && snapshot.empty) {
                        window.dbSave('users', 'admin', { id: 'admin', username: 'admin', password: 'admin123', role: 'admin' });
                        window.dbSave('users', 'func', { id: 'func', username: 'func', password: 'func123', role: 'funcionario' });
                    }

                    if (window.currentSystemUser) {
                        if (window.currentSystemUser.role === 'admin') {
                            const isTableTab = ['admin-reports', 'admin-quotes', 'admin-thirdParty', 'admin-ceis', 'admin-users', 'admin-audit', 'dashboard'].includes(window.activeTab);
                            if(isTableTab) renderActiveTab();
                        } else { 
                            if(window.activeTab === 'func-history') window.renderEmployeeHistory(); 
                        }
                    }
                }, (error) => { console.error(`Erro escutando ${col}:`, error); });
                window.unsubscribers.push(unsub);
            });
        };

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            
            const user = window.localData.users.find(x => x.username === u && x.password === p);
            if (user) {
                window.currentSystemUser = user;
                window.showToast(`Bem-vindo, ${u}!`);
                window.logAudit(`Login Efetuado`);
                
                loginScreen.classList.add('hidden');
                appLayout.classList.remove('hidden');
                
                document.getElementById('userNameDisplay').textContent = u;
                document.getElementById('userRoleDisplay').textContent = user.role === 'admin' ? 'Administrador' : 'Funcionário';
                document.getElementById('userInitial').textContent = u.charAt(0).toUpperCase();
                
                buildMenu();
                window.activeTab = user.role === 'admin' ? 'dashboard' : 'func-reports';
                renderActiveTab();
            } else {
                window.showToast("Usuário ou senha inválidos", "error");
            }
        });

        window.logout = () => {
            window.logAudit(`Logout Efetuado`);
            window.currentSystemUser = null;
            appLayout.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            document.getElementById('loginForm').reset();
        };

        // Construção do Menu e Abas
        const buildMenu = () => {
            navLinks.innerHTML = "";
            document.getElementById('mobileMenuBtn').onclick = () => {
                navLinks.classList.toggle('hidden');
                navLinks.classList.toggle('flex');
            };

            const role = window.currentSystemUser.role;
            let menuItems = role === 'admin' ? [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Resumo Geral' },
                { id: 'admin-ceis', icon: 'fa-school', label: 'Creches (CEIs)' },
                { id: 'admin-users', icon: 'fa-users', label: 'Usuários' },
                { id: 'admin-reports', icon: 'fa-tools', label: 'Serviços Concluídos' },
                { id: 'admin-quotes', icon: 'fa-file-invoice-dollar', label: 'Orçamentos' },
                { id: 'admin-thirdParty', icon: 'fa-handshake', label: 'Serviços Terceiros' },
                { id: 'admin-audit', icon: 'fa-list-alt', label: 'Auditoria' }
            ] : [
                { id: 'func-reports', icon: 'fa-wrench', label: 'Registrar Serviço' },
                { id: 'func-quotes', icon: 'fa-file-invoice', label: 'Fazer Orçamento' },
                { id: 'func-thirdParty', icon: 'fa-eye', label: 'Acompanhar Terceiro' },
                { id: 'func-history', icon: 'fa-history', label: 'Meus Registros' }
            ];

            menuItems.forEach(item => {
                const a = document.createElement('a');
                a.href = "#";
                a.className = "flex items-center gap-3 px-6 py-3 text-slate-300 hover:bg-slate-800 hover:text-white transition group";
                a.innerHTML = `<i class="fas ${item.icon} w-5 text-center group-hover:text-blue-400 transition"></i> <span class="font-medium">${item.label}</span>`;
                a.onclick = (e) => {
                    e.preventDefault();
                    window.activeTab = item.id;
                    if(window.innerWidth < 768) { navLinks.classList.add('hidden'); navLinks.classList.remove('flex'); }
                    renderActiveTab();
                };
                navLinks.appendChild(a);
            });
        };

        const renderActiveTab = () => {
            if(!window.currentSystemUser) return;
            const role = window.currentSystemUser.role;
            let html = ""; let title = "";

            if(role === 'admin') {
                switch(window.activeTab) {
                    case 'dashboard': title = "Resumo Geral"; html = renderAdminDashboard(); break;
                    case 'admin-ceis': title = "Gestão de Creches (CEIs)"; html = renderAdminCeis(); break;
                    case 'admin-users': title = "Gestão de Usuários"; html = renderAdminUsers(); break;
                    case 'admin-reports': title = "Serviços Concluídos"; html = renderAdminReports(); break;
                    case 'admin-quotes': title = "Orçamentos Recebidos"; html = renderAdminQuotes(); break;
                    case 'admin-thirdParty': title = "Acompanhamento Terceiros"; html = renderAdminThirdParty(); break;
                    case 'admin-audit': title = "Logs de Auditoria"; html = renderAdminAudit(); break;
                }
            } else {
                switch(window.activeTab) {
                    case 'func-reports': title = "Registrar Manutenção"; html = renderFuncReportForm(); break;
                    case 'func-quotes': title = "Novo Orçamento"; html = renderFuncQuoteForm(); break;
                    case 'func-thirdParty': title = "Acompanhar Terceiro"; html = renderFuncThirdPartyForm(); break;
                    case 'func-history': title = "Meus Registros"; html = renderFuncHistory(); break;
                }
            }
            
            document.getElementById('mobilePageTitle').textContent = title;
            mainContent.innerHTML = `<h2 class="text-2xl font-bold text-slate-800 mb-6 hidden md:block">${title}</h2>${html}`;
            
            if(window.activeTab === 'func-reports') populateCeiSelect('ceiSelectRep');
            if(window.activeTab === 'func-quotes') populateCeiSelect('ceiSelectQuote');
            if(window.activeTab === 'func-thirdParty') populateCeiSelect('ceiSelectThirdParty');
            if(window.activeTab === 'func-history') window.renderEmployeeHistory();
            if(['admin-reports', 'admin-quotes', 'admin-thirdParty'].includes(window.activeTab)) window.setupAdminFilters();
        };

        const populateCeiSelect = (elementId) => {
            const sel = document.getElementById(elementId);
            if(!sel) return;
            sel.innerHTML = '<option value="">Selecione a Creche...</option>';
            window.localData.ceis.forEach(c => {
                sel.innerHTML += `<option value="${c.name}" data-id="${c.id}">${c.name}</option>`;
            });
        };

        const renderAdminDashboard = () => {
            return `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 animate-fade-in">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-2xl"><i class="fas fa-tools"></i></div>
                    <div><p class="text-slate-500 text-sm font-medium">Serviços</p><p class="text-2xl font-bold text-slate-800">${window.localData.reports.length}</p></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center text-2xl"><i class="fas fa-file-invoice-dollar"></i></div>
                    <div><p class="text-slate-500 text-sm font-medium">Orçamentos</p><p class="text-2xl font-bold text-slate-800">${window.localData.quotes.length}</p></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-2xl"><i class="fas fa-handshake"></i></div>
                    <div><p class="text-slate-500 text-sm font-medium">Terceiros</p><p class="text-2xl font-bold text-slate-800">${window.localData.thirdParty.length}</p></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                    <div class="w-14 h-14 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-2xl"><i class="fas fa-school"></i></div>
                    <div><p class="text-slate-500 text-sm font-medium">Creches</p><p class="text-2xl font-bold text-slate-800">${window.localData.ceis.length}</p></div>
                </div>
            </div>`;
        };

        const renderAdminCeis = () => {
            let trs = window.localData.ceis.map(c => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4 font-medium">${c.name}</td><td class="p-4 text-sm text-slate-500">${c.telegramGroupId || '-'} / ${c.telegramTopicId || '-'}</td><td class="p-4 text-right space-x-2"><button onclick="window.editCei('${c.id}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded"><i class="fas fa-edit"></i></button><button onclick="window.deleteCei('${c.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded"><i class="fas fa-trash"></i></button></td></tr>`).join("");
            return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="p-4 border-b bg-slate-50 flex justify-between items-center"><h3 class="font-semibold text-slate-700">Creches Cadastradas</h3><button onclick="window.openCeiModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium shadow-sm"><i class="fas fa-plus mr-1"></i> Nova Creche</button></div><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Nome</th><th class="p-4 font-semibold">Telegram (Grupo / Tópico)</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody>${trs || `<tr><td colspan="3" class="p-8 text-center text-slate-400">Nenhuma creche cadastrada.</td></tr>`}</tbody></table></div></div>`;
        };

        const renderAdminUsers = () => {
            let trs = window.localData.users.map(u => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4 font-medium">${u.username}</td><td class="p-4 text-sm"><span class="px-2 py-1 rounded-full text-xs font-bold ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-green-100 text-green-700'}">${u.role.toUpperCase()}</span></td><td class="p-4 text-right space-x-2"><button onclick="window.editUser('${u.id}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded"><i class="fas fa-edit"></i></button><button onclick="window.deleteUser('${u.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded"><i class="fas fa-trash"></i></button></td></tr>`).join("");
            return `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="p-4 border-b bg-slate-50 flex justify-between items-center"><h3 class="font-semibold text-slate-700">Usuários do Sistema</h3><button onclick="window.openUserModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm font-medium shadow-sm"><i class="fas fa-user-plus mr-1"></i> Novo Usuário</button></div><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Login</th><th class="p-4 font-semibold">Nível</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody>${trs}</tbody></table></div></div>`;
        };

        const renderFilterBar = (type) => `
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 animate-fade-in">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 items-end">
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Pesquisar</label><input type="text" id="filterSearch" class="w-full p-2 border rounded-lg text-sm outline-none" placeholder="Nome, CEI..."></div>
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Data Início</label><input type="date" id="filterDateStart" class="w-full p-2 border rounded-lg text-sm outline-none"></div>
                    <div><label class="block text-xs font-semibold text-slate-500 mb-1">Data Fim</label><input type="date" id="filterDateEnd" class="w-full p-2 border rounded-lg text-sm outline-none"></div>
                    <div class="flex gap-2">
                        <button onclick="window.applyFilters('${type}')" class="flex-1 bg-slate-800 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-slate-900"><i class="fas fa-filter"></i> Filtrar</button>
                        <button onclick="window.exportToExcel('${type}')" class="flex-1 bg-green-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-green-700"><i class="fas fa-file-excel"></i> Excel</button>
                    </div>
                </div>
            </div>
        `;

        const renderAdminReports = () => return renderFilterBar('reports') + `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Data</th><th class="p-4 font-semibold">CEI</th><th class="p-4 font-semibold">Técnico</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody id="tableBodyReports"></tbody></table></div></div>`;
        const renderAdminQuotes = () => return renderFilterBar('quotes') + `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Data</th><th class="p-4 font-semibold">CEI</th><th class="p-4 font-semibold">Total Orçado</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody id="tableBodyQuotes"></tbody></table></div></div>`;
        const renderAdminThirdParty = () => return renderFilterBar('thirdParty') + `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Data</th><th class="p-4 font-semibold">CEI</th><th class="p-4 font-semibold">Empresa</th><th class="p-4 font-semibold text-right">Ações</th></tr></thead><tbody id="tableBodyThirdParty"></tbody></table></div></div>`;
        const renderAdminAudit = () => `<div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden animate-fade-in"><div class="overflow-x-auto"><table class="w-full text-left border-collapse whitespace-nowrap"><thead><tr class="bg-slate-100 text-slate-500 text-sm"><th class="p-4 font-semibold">Data/Hora</th><th class="p-4 font-semibold">Usuário</th><th class="p-4 font-semibold">Ação Realizada</th></tr></thead><tbody>${[...window.localData.audit].sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)).slice(0, 50).map(a => `<tr class="border-b border-slate-100 hover:bg-slate-50 text-sm"><td class="p-4">${new Date(a.timestamp).toLocaleString('pt-BR')}</td><td class="p-4 font-medium text-slate-700 capitalize">${a.user}</td><td class="p-4 text-slate-600">${a.action}</td></tr>`).join("") || `<tr><td colspan="3" class="p-8 text-center text-slate-400">Nenhum log registrado.</td></tr>`}</tbody></table></div></div>`;

        let currentFilteredData = [];
        window.setupAdminFilters = () => { window.applyFilters(window.activeTab.split('-')[1]); };
        
        window.applyFilters = (type) => {
            const search = document.getElementById('filterSearch')?.value.toLowerCase() || "";
            const start = document.getElementById('filterDateStart')?.value || "";
            const end = document.getElementById('filterDateEnd')?.value || "";
            
            let data = [...window.localData[type]];
            if(search) {
                data = data.filter(item => (item.cei && item.cei.toLowerCase().includes(search)) || (item.userName && item.userName.toLowerCase().includes(search)) || (item.companyName && item.companyName.toLowerCase().includes(search)) || (item.workDone && item.workDone.toLowerCase().includes(search)));
            }
            if(start) data = data.filter(item => item.date >= start);
            if(end) data = data.filter(item => item.date <= end);
            
            data.sort((a,b) => new Date(b.date) - new Date(a.date));
            currentFilteredData = data; 
            
            const tbody = document.getElementById(`tableBody${type.charAt(0).toUpperCase() + type.slice(1)}`);
            if(!tbody) return;
            
            tbody.innerHTML = data.map(item => {
                let col3 = "";
                if(type === 'reports') col3 = item.userName;
                if(type === 'quotes') col3 = window.formatMoney(item.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0));
                if(type === 'thirdParty') col3 = item.companyName;

                return `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="p-4">${window.formatDateBR(item.date)}</td><td class="p-4 font-medium">${item.cei}</td><td class="p-4 text-slate-600 capitalize">${col3}</td><td class="p-4 text-right"><button onclick="window.viewRecord('${type}', '${item.id}')" class="text-blue-500 hover:text-blue-700 bg-blue-50 p-2 rounded shadow-sm border border-blue-100"><i class="fas fa-eye"></i> Detalhes</button></td></tr>`;
            }).join("") || `<tr><td colspan="4" class="p-8 text-center text-slate-400">Nenhum registro encontrado.</td></tr>`;
        };

        window.openCeiModal = () => { window.editingItemId = null; document.getElementById('ceiForm').reset(); document.getElementById('modalTitleCei').textContent = "Nova Creche (CEI)"; window.showElement('modalCei'); };
        window.editCei = (id) => { const c = window.localData.ceis.find(x => x.id === id); if(c) { window.editingItemId = id; document.getElementById('ceiName').value = c.name; document.getElementById('ceiTelegramId').value = c.telegramGroupId || ""; document.getElementById('ceiTelegramTopicId').value = c.telegramTopicId || ""; document.getElementById('modalTitleCei').textContent = "Editar Creche (CEI)"; window.showElement('modalCei'); } };
        document.getElementById('ceiForm').addEventListener('submit', async (e) => { e.preventDefault(); const n = document.getElementById('ceiName').value.trim(); const tg = document.getElementById('ceiTelegramId').value.trim(); const tp = document.getElementById('ceiTelegramTopicId').value.trim(); if(!n) return; const id = window.editingItemId || Date.now().toString(); await window.dbSave('ceis', id, { id, name: n, telegramGroupId: tg, telegramTopicId: tp }); window.logAudit(window.editingItemId ? `CEI Editado: ${n}` : `CEI Criado: ${n}`); window.showToast("CEI salvo!"); window.hideElement('modalCei'); });
        window.deleteCei = (id) => { window.confirmAction(async () => { await window.dbDelete('ceis', id); window.logAudit(`CEI Excluído ID: ${id}`); window.showToast("CEI excluído!"); }); };

        window.openUserModal = () => { window.editingItemId = null; document.getElementById('userForm').reset(); document.getElementById('modalTitleUser').textContent = "Novo Usuário"; window.showElement('modalUser'); };
        window.editUser = (id) => { const u = window.localData.users.find(x => x.id === id); if(u) { window.editingItemId = id; document.getElementById('newUsername').value = u.username; document.getElementById('newPassword').value = u.password; document.getElementById('newRole').value = u.role; document.getElementById('modalTitleUser').textContent = "Editar Usuário"; window.showElement('modalUser'); } };
        document.getElementById('userForm').addEventListener('submit', async (e) => { e.preventDefault(); const u = document.getElementById('newUsername').value.trim(); const p = document.getElementById('newPassword').value.trim(); const r = document.getElementById('newRole').value; if(!u || !p) return; const id = window.editingItemId || Date.now().toString(); await window.dbSave('users', id, { id, username: u, password: p, role: r }); window.logAudit(window.editingItemId ? `Usuário Editado: ${u}` : `Usuário Criado: ${u}`); window.showToast("Usuário salvo!"); window.hideElement('modalUser'); });
        window.deleteUser = (id) => { if(id === window.currentSystemUser.id) return window.showToast("Não pode excluir a si mesmo", "error"); window.confirmAction(async () => { await window.dbDelete('users', id); window.logAudit(`Usuário Excluído ID: ${id}`); window.showToast("Usuário excluído!"); }); };

        window.viewRecord = (type, id) => {
            const record = window.localData[type].find(r => r.id === id);
            if(!record) return;
            const btnPrint = document.getElementById('btnPrintRecord');
            if(type === 'quotes') { btnPrint.classList.remove('hidden'); btnPrint.onclick = () => window.printQuote(record); } else { btnPrint.classList.add('hidden'); }

            let html = `<div class="grid grid-cols-2 gap-y-2 text-sm mb-6 bg-slate-50 p-4 rounded border"><div><span class="font-bold text-slate-500">Data:</span> ${window.formatDateBR(record.date)}</div><div><span class="font-bold text-slate-500">CEI:</span> ${record.cei}</div><div><span class="font-bold text-slate-500">Registro por:</span> <span class="capitalize">${record.userName}</span></div>`;
            if(type === 'reports' || type === 'thirdParty') html += `<div><span class="font-bold text-slate-500">Horário:</span> ${record.timeStart} às ${record.timeEnd}</div>`;
            if(type === 'thirdParty') html += `<div class="col-span-2"><span class="font-bold text-slate-500">Empresa:</span> ${record.companyName}</div>`;
            if(type === 'reports') html += `<div><span class="font-bold text-slate-500">Dificuldade:</span> ${record.difficulty}/5</div>`;
            html += `</div>`;

            if(record.workDone) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Serviço Realizado / Descrição</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-slate-50 p-3 rounded border">${record.workDone}</p>`;

            if(record.materials && record.materials.length > 0) {
                html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Materiais / Custos</h4><table class="w-full text-sm text-left mb-6 border"><thead class="bg-slate-100"><tr><th class="p-2 border">Qtd</th><th class="p-2 border">Material</th><th class="p-2 border">Marca</th><th class="p-2 border text-right">R$ Un.</th><th class="p-2 border text-right">Total</th></tr></thead><tbody>`;
                let totalGeral = 0;
                record.materials.forEach(m => {
                    const price = parseFloat(m.price || 0); const q = parseFloat(m.qtd || 1); const total = price * q; totalGeral += total;
                    html += `<tr><td class="p-2 border">${m.qtd}</td><td class="p-2 border">${m.name}</td><td class="p-2 border">${m.brand||'-'}</td><td class="p-2 border text-right">${window.formatMoney(price)}</td><td class="p-2 border font-medium text-right">${window.formatMoney(total)}</td></tr>`;
                });
                if(type === 'reports' || type === 'quotes') html += `<tr class="bg-blue-50"><td colspan="4" class="p-2 border text-right font-bold">TOTAL:</td><td class="p-2 border font-bold text-blue-700 text-right text-lg">${window.formatMoney(totalGeral)}</td></tr>`;
                html += `</tbody></table>`;
            }

            if(record.obs) html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Observações</h4><p class="text-slate-600 text-sm whitespace-pre-wrap mb-6 bg-yellow-50 p-3 border border-yellow-200 rounded">${record.obs}</p>`;

            if(record.telegramSent) {
                html += `<div class="bg-green-50 text-green-700 p-3 rounded-lg flex items-center gap-2 mt-4 border border-green-200 font-medium"><i class="fab fa-telegram text-xl"></i> PDF e Fotos enviados com sucesso para o Telegram da creche.</div>`;
            } else if(record.photos && record.photos.length > 0) {
                html += `<h4 class="font-bold text-slate-700 mb-2 border-b pb-1">Fotos (Banco Local)</h4><div class="grid grid-cols-3 gap-2">`;
                record.photos.forEach(b64 => { html += `<a href="${b64}" target="_blank" class="block border rounded p-1 hover:border-blue-500 transition"><img src="${b64}" class="w-full h-24 object-cover rounded"></a>`; });
                html += `</div>`;
            }

            document.getElementById('viewRecordContent').innerHTML = html;
            window.showElement('modalViewRecord');
        };

        window.printQuote = (record) => {
            const printArea = document.getElementById('printArea');
            let totalGeral = record.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0);
            let matHtml = record.materials.map(m => `<tr style="border-bottom: 1px solid #ddd;"><td style="padding: 12px 8px;">${m.qtd}</td><td style="padding: 12px 8px;">${m.name} ${m.brand ? '('+m.brand+')' : ''}</td><td style="padding: 12px 8px;">${window.formatMoney(m.price)}</td><td style="padding: 12px 8px; text-align:right;">${window.formatMoney(m.qtd * m.price)}</td></tr>`).join('');

            printArea.innerHTML = `<div style="font-family: Arial, sans-serif; color: #333; max-width: 800px; margin: 0 auto; line-height: 1.5;"><div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #2563eb; padding-bottom: 20px; margin-bottom: 30px;"><div><h1 style="margin:0; font-size: 28px; color:#1e293b;">LYM Eletrônicos</h1><p style="margin:5px 0 0; color:#64748b;">Orçamento Comercial</p></div><div style="text-align: right; color:#64748b; font-size:14px;"><p style="margin:0;">Data: <strong>${window.formatDateBR(record.date)}</strong></p><p style="margin:0;">Ref: #LYM-${record.id.substring(record.id.length-6)}</p></div></div><div style="background: #f8fafc; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px solid #e2e8f0;"><p style="margin:0 0 10px;"><strong>Cliente / Local:</strong> ${record.cei}</p><p style="margin:0 0 10px;"><strong>Técnico Responsável:</strong> <span style="text-transform:capitalize;">${record.userName}</span></p>${record.workDone ? `<p style="margin:0;"><strong>Descrição do Serviço:</strong><br>${record.workDone.replace(/\n/g, '<br>')}</p>` : ''}</div><table style="width: 100%; border-collapse: collapse; margin-bottom: 30px;"><thead><tr style="background: #1e293b; color: white; text-align: left;"><th style="padding: 12px 8px;">Qtd</th><th style="padding: 12px 8px;">Descrição do Material/Serviço</th><th style="padding: 12px 8px;">Valor Un.</th><th style="padding: 12px 8px; text-align:right;">Subtotal</th></tr></thead><tbody>${matHtml}<tr style="background: #f1f5f9; font-weight: bold; font-size: 18px;"><td colspan="3" style="padding: 15px 8px; text-align: right; color: #0f172a;">TOTAL DO ORÇAMENTO:</td><td style="padding: 15px 8px; text-align:right; color: #2563eb;">${window.formatMoney(totalGeral)}</td></tr></tbody></table>${record.obs ? `<div style="margin-bottom: 40px; padding-top:20px; border-top: 1px solid #e2e8f0;"><p style="margin:0;"><strong>Observações Importantes:</strong><br>${record.obs.replace(/\n/g, '<br>')}</p></div>` : ''}<div style="text-align:center; color:#94a3b8; font-size:12px; margin-top:50px; border-top: 1px solid #e2e8f0; padding-top:20px;">Este orçamento é válido por 15 dias. Qualquer alteração no escopo poderá gerar reajuste nos valores.</div></div>`;
            window.print();
        };

        window.exportToExcel = (type) => {
            if(currentFilteredData.length === 0) return window.showToast("Nenhum dado para exportar", "error");
            let exportData = [];
            if(type === 'reports') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Tecnico: r.userName, Inicio: r.timeStart, Termino: r.timeEnd, Dificuldade: r.difficulty, Servico: r.workDone, Materiais: r.materials ? r.materials.map(m => `${m.qtd}x ${m.name} (${m.brand}) R$${m.price}`).join(" | ") : "", TotalGasto: r.materials ? r.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0) : 0, Observacao: r.obs, Telegram: r.telegramSent ? "Sim" : "Não" }));
            } else if (type === 'quotes') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Tecnico: r.userName, Descricao: r.workDone, Materiais: r.materials ? r.materials.map(m => `${m.qtd}x ${m.name} R$${m.price}`).join(" | ") : "", Total_Orcado: r.materials ? r.materials.reduce((acc, m) => acc + (parseFloat(m.qtd)*parseFloat(m.price||0)), 0) : 0, Observacao: r.obs }));
            } else if (type === 'thirdParty') {
                exportData = currentFilteredData.map(r => ({ Data: window.formatDateBR(r.date), Creche: r.cei, Funcionario_Acompanhante: r.userName, Empresa_Terceirizada: r.companyName, Inicio: r.timeStart, Termino: r.timeEnd, Servico_Realizado: r.workDone, Observacao: r.obs }));
            }
            const ws = XLSX.utils.json_to_sheet(exportData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Relatório");
            XLSX.writeFile(wb, `LYM_${type}_${new Date().getTime()}.xlsx`);
            window.logAudit(`Exportou Excel: ${type}`);
        };

        // Inputs de Materiais
        const renderMaterialInputs = () => `
            <div class="bg-slate-100 p-4 sm:p-5 rounded-xl border border-slate-200 mt-4">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="font-bold text-slate-700"><i class="fas fa-boxes mr-2"></i>Materiais / Peças Utilizadas</h4>
                    <button type="button" onclick="window.addMaterialRow('materialsContainer')" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 shadow"><i class="fas fa-plus mr-1"></i> Adicionar Item</button>
                </div>
                <div id="materialsContainer" class="space-y-3"><p class="text-sm text-slate-500 italic">Nenhum material listado.</p></div>
            </div>`;

        const renderFormFieldsCommon = (typeId) => `
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div><label class="block text-sm font-bold text-slate-700 mb-1">Selecione a Creche (CEI) *</label><select id="ceiSelect${typeId}" required class="w-full p-3 border rounded-lg outline-none focus:border-blue-500"></select></div>
                <div><label class="block text-sm font-bold text-slate-700 mb-1">Data *</label><input type="date" id="date${typeId}" required class="w-full p-3 border rounded-lg outline-none focus:border-blue-500" value="${new Date().toISOString().split('T')[0]}"></div>
            </div>`;

        const renderTimeFields = (typeId) => `
            <div class="grid grid-cols-2 gap-4">
                <div><label class="block text-sm font-bold text-slate-700 mb-1">Hora Início *</label><input type="time" id="timeStart${typeId}" required class="w-full p-3 border rounded-lg outline-none focus:border-blue-500"></div>
                <div><label class="block text-sm font-bold text-slate-700 mb-1">Hora Término *</label><input type="time" id="timeEnd${typeId}" required class="w-full p-3 border rounded-lg outline-none focus:border-blue-500"></div>
            </div>`;

        const renderFuncReportForm = () => `
            <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border p-4 sm:p-6 mb-8 animate-fade-in">
                <div class="flex justify-between items-center mb-6 border-b pb-2">
                    <h3 class="text-xl font-bold text-blue-800 flex items-center gap-2"><i class="fas fa-wrench"></i> <span id="formTitleReports">Registrar Manutenção</span></h3>
                </div>
                <form id="reportForm" onsubmit="window.saveRecord(event, 'reports')" class="space-y-5">
                    <input type="hidden" id="editIdreports">
                    ${renderFormFieldsCommon('Rep')}
                    ${renderTimeFields('Rep')}
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">O que foi feito? *</label><textarea id="workDoneRep" required rows="3" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none"></textarea></div>
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">Nível de Dificuldade (1 a 5) *</label>
                        <input type="range" id="diffRep" min="1" max="5" value="3" class="w-full" oninput="document.getElementById('diffVal').textContent = this.value">
                        <div class="text-center text-sm font-bold text-blue-600">Nível <span id="diffVal">3</span></div>
                    </div>
                    ${renderMaterialInputs()}
                    <div class="bg-slate-50 p-4 rounded-xl border mt-4">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Fotos do Serviço</label>
                        <input type="file" id="photosRep" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="window.handlePhotoSelection(event, 'repPhotoPreview')">
                        <div id="repPhotoPreview" class="flex gap-2 mt-3 overflow-x-auto pb-2"></div>
                    </div>
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Observações (Opcional)</label><textarea id="obsRep" rows="2" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none"></textarea></div>
                    <button type="submit" id="btnSubmitReport" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg mt-4">Salvar Serviço</button>
                </form>
            </div>`;

        const renderFuncQuoteForm = () => `
            <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border p-4 sm:p-6 mb-8 animate-fade-in">
                <h3 class="text-xl font-bold text-green-700 flex items-center gap-2 mb-6 border-b pb-2"><i class="fas fa-file-invoice"></i> <span id="formTitleQuotes">Novo Orçamento</span></h3>
                <form id="quoteForm" onsubmit="window.saveRecord(event, 'quotes')" class="space-y-5">
                    <input type="hidden" id="editIdquotes">
                    ${renderFormFieldsCommon('Quote')}
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Descrição / Diagnóstico *</label><textarea id="workDoneQuote" required rows="3" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none" placeholder="Qual o problema? O que precisa ser feito?"></textarea></div>
                    ${renderMaterialInputs().replace('materialsContainer', 'quoMaterialsContainer')}
                    <div class="bg-slate-50 p-4 rounded-xl border mt-4">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Fotos do Problema</label>
                        <input type="file" id="photosQuote" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="window.handlePhotoSelection(event, 'quoPhotoPreview')">
                        <div id="quoPhotoPreview" class="flex gap-2 mt-3 overflow-x-auto pb-2"></div>
                    </div>
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Observações do Orçamento</label><textarea id="obsQuote" rows="2" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none"></textarea></div>
                    <button type="submit" id="btnSubmitQuote" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg mt-4">Salvar Orçamento</button>
                </form>
            </div>`;

        const renderFuncThirdPartyForm = () => `
            <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border p-4 sm:p-6 mb-8 animate-fade-in">
                <h3 class="text-xl font-bold text-purple-700 flex items-center gap-2 mb-6 border-b pb-2"><i class="fas fa-eye"></i> <span id="formTitleThirdParty">Acompanhamento Terceiros</span></h3>
                <form id="thirdPartyForm" onsubmit="window.saveRecord(event, 'thirdParty')" class="space-y-5">
                    <input type="hidden" id="editIdthirdParty">
                    ${renderFormFieldsCommon('ThirdParty')}
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Nome da Empresa Terceirizada *</label><input type="text" id="companyNameThirdParty" required class="w-full p-3 border rounded-lg outline-none focus:border-blue-500"></div>
                    ${renderTimeFields('ThirdParty')}
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Serviço Realizado pelo Terceiro *</label><textarea id="workDoneThirdParty" required rows="3" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none"></textarea></div>
                    <div class="bg-slate-50 p-4 rounded-xl border mt-4">
                        <label class="block text-sm font-bold text-slate-700 mb-2">Fotos do Serviço</label>
                        <input type="file" id="photosThirdParty" multiple accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" onchange="window.handlePhotoSelection(event, 'tpPhotoPreview')">
                        <div id="tpPhotoPreview" class="flex gap-2 mt-3 overflow-x-auto pb-2"></div>
                    </div>
                    <div><label class="block text-sm font-bold text-slate-700 mb-1">Observações / Problemas (Opcional)</label><textarea id="obsThirdParty" rows="2" class="w-full p-3 border rounded-lg outline-none focus:border-blue-500 resize-none"></textarea></div>
                    <button type="submit" id="btnSubmitThirdParty" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transition text-lg mt-4">Salvar Acompanhamento</button>
                </form>
            </div>`;

        window.cancelEdit = () => { window.activeTab = 'func-history'; renderActiveTab(); };

        window.editFuncRecord = (type, id) => {
            const record = window.localData[type].find(r => r.id === id); if(!record) return;
            if(type === 'reports') window.activeTab = 'func-reports';
            if(type === 'quotes') window.activeTab = 'func-quotes';
            if(type === 'thirdParty') window.activeTab = 'func-thirdParty';
            renderActiveTab();
            
            setTimeout(() => {
                const sffx = type === 'reports' ? 'Rep' : (type === 'quotes' ? 'Quote' : 'ThirdParty');
                document.getElementById(`editId${type}`).value = record.id;
                
                const selectCei = document.getElementById(`ceiSelect${sffx}`);
                const opt = Array.from(selectCei.options).find(o => o.value === record.cei);
                if(opt) selectCei.value = opt.value;
                
                document.getElementById(`date${sffx}`).value = record.date;
                document.getElementById(`workDone${sffx}`).value = record.workDone;
                if(record.obs) document.getElementById(`obs${sffx}`).value = record.obs;
                
                if(type === 'reports' || type === 'thirdParty') {
                    document.getElementById(`timeStart${sffx}`).value = record.timeStart;
                    document.getElementById(`timeEnd${sffx}`).value = record.timeEnd;
                }
                if(type === 'thirdParty') { document.getElementById('companyNameThirdParty').value = record.companyName; }
                if(type === 'reports') { document.getElementById('diffRep').value = record.difficulty; document.getElementById('diffVal').textContent = record.difficulty; }
                
                if((type === 'reports' || type === 'quotes') && record.materials) {
                    const contId = type === 'reports' ? 'materialsContainer' : 'quoMaterialsContainer';
                    document.getElementById(contId).innerHTML = '';
                    record.materials.forEach(m => {
                        window.addMaterialRow(contId);
                        const lastRow = document.getElementById(`mat_${window.materialCount}`);
                        lastRow.querySelector('.mat-name').value = m.name;
                        if(m.brand) lastRow.querySelector('.mat-brand').value = m.brand;
                        lastRow.querySelector('.mat-qtd').value = m.qtd;
                        if(m.price) lastRow.querySelector('.mat-price').value = m.price;
                    });
                }
                
                document.getElementById(`formTitle${type.charAt(0).toUpperCase() + type.slice(1)}`).textContent = `Editando ${type === 'reports' ? 'Serviço' : (type==='quotes'?'Orçamento':'Acompanhamento')}`;
                if(document.getElementById('cancelEditBtn')) window.showElement('cancelEditBtn');
            }, 100);
        };

        window.deleteFuncRecord = (type, id) => {
            window.confirmAction(async () => {
                await window.dbDelete(type, id);
                window.logAudit(`Funcionário excluiu seu ${type} ID: ${id}`);
                window.showToast("Registro excluído com sucesso!");
                window.renderEmployeeHistory();
            });
        };

        window.saveRecord = async (e, type) => {
            e.preventDefault();
            const btnId = type === 'reports' ? 'btnSubmitReport' : (type === 'quotes' ? 'btnSubmitQuote' : 'btnSubmitThirdParty');
            const btn = document.getElementById(btnId);
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processando...'; btn.disabled = true;

            try {
                const sffx = type === 'reports' ? 'Rep' : (type === 'quotes' ? 'Quote' : 'ThirdParty');
                const editId = document.getElementById(`editId${type}`).value;
                const isEdit = !!editId;
                const recordId = editId || Date.now().toString();
                
                const selectElement = document.getElementById(`ceiSelect${sffx}`);
                const ceiName = selectElement.value;
                const ceiId = selectElement.options[selectElement.selectedIndex]?.dataset.id;
                
                const recordData = {
                    id: recordId, userId: window.currentSystemUser.id, userName: window.currentSystemUser.username,
                    cei: ceiName, ceiId: ceiId, date: document.getElementById(`date${sffx}`).value,
                    workDone: document.getElementById(`workDone${sffx}`).value, obs: document.getElementById(`obs${sffx}`).value || "", timestamp: new Date().toISOString()
                };

                if(type === 'reports' || type === 'thirdParty') {
                    recordData.timeStart = document.getElementById(`timeStart${sffx}`).value;
                    recordData.timeEnd = document.getElementById(`timeEnd${sffx}`).value;
                }
                if(type === 'thirdParty') recordData.companyName = document.getElementById('companyNameThirdParty').value;
                if(type === 'reports') recordData.difficulty = document.getElementById('diffRep').value;

                if(type === 'reports' || type === 'quotes') {
                    const contId = type === 'reports' ? 'materialsContainer' : 'quoMaterialsContainer';
                    const container = document.getElementById(contId);
                    const mats = [];
                    container.querySelectorAll('[id^="mat_"]').forEach(row => {
                        mats.push({ name: row.querySelector('.mat-name').value, brand: row.querySelector('.mat-brand').value, qtd: row.querySelector('.mat-qtd').value, price: row.querySelector('.mat-price').value });
                    });
                    recordData.materials = mats;
                }

                let base64Photos = [];
                const typeLabel = type === 'reports' ? 'Manutenção' : (type === 'quotes' ? 'Orçamento' : 'Acompanhamento');
                const fileInputId = type === 'reports' ? 'photosRep' : (type === 'quotes' ? 'photosQuote' : 'photosThirdParty');
                const fileInput = document.getElementById(fileInputId);
                
                if (fileInput && fileInput.files.length > 0) {
                    for(let file of fileInput.files) {
                        const b64 = await window.compressImage(file); base64Photos.push(b64);
                    }
                } else if (isEdit) {
                    const oldRecord = window.localData[type].find(r => r.id === editId);
                    if(oldRecord && oldRecord.photos) base64Photos = oldRecord.photos;
                }
                
                if (ceiId) {
                    const tgSent = await window.sendToTelegram(ceiId, recordData, base64Photos, isEdit, typeLabel);
                    if (tgSent) {
                        recordData.telegramSent = true; base64Photos = []; 
                    } else {
                        recordData.telegramSent = false; recordData.photos = base64Photos; 
                    }
                } else { recordData.photos = base64Photos; }

                await window.dbSave(type, recordId, recordData);
                window.logAudit(`${isEdit ? 'Editou' : 'Registrou'} ${type} ID: ${recordId}`);
                window.showToast(isEdit ? "Atualizado e Enviado!" : "Salvo e Enviado!");
                
                if (isEdit) window.cancelEdit();
                else {
                    document.getElementById(`${type === 'reports' ? 'reportForm' : (type==='quotes'?'quoteForm':'thirdPartyForm')}`).reset();
                    if(type === 'reports') { document.getElementById('materialsContainer').innerHTML = '<p class="text-sm text-slate-400 italic">Nenhum material listado.</p>'; document.getElementById('repPhotoPreview').innerHTML = ''; }
                    if(type === 'quotes') { document.getElementById('quoMaterialsContainer').innerHTML = '<p class="text-sm text-slate-400 italic">Nenhum material listado.</p>'; document.getElementById('quoPhotoPreview').innerHTML = ''; }
                    if(type === 'thirdParty') document.getElementById('tpPhotoPreview').innerHTML = '';
                }
            } catch (err) { console.error(err); window.showToast("Erro ao salvar", "error"); } 
            finally { btn.innerHTML = originalBtnText; btn.disabled = false; }
        };

        window.onload = () => { setupRealtimeSync(); };
    </script>
</body>
</html>
